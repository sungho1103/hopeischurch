name: Generate Bulletin Data

on:
  schedule:
    - cron: '0 15 * * 6'  # 매주 토요일 00:00 KST (15:00 UTC)
  workflow_dispatch:       # 수동 실행 가능

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate bulletin data
        run: node scripts/generate_bulletin_data.mjs

      - name: Commit and push bulletin data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bulletin/data/
          git diff --cached --quiet || git commit -m "chore: update bulletin data [skip ci]"
          git push
