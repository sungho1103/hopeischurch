name: Update Bulletin Index

on:
  push:
    paths:
      - 'bulletin/data/20**.json'

jobs:
  update-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update index.json from bulletin data files
        run: |
          node --input-type=module <<'JSEOF'
          import { readdirSync, readFileSync, writeFileSync } from "fs";
          import { join } from "path";

          const dataDir = "bulletin/data";
          const files = readdirSync(dataDir)
            .filter(f => /^\d{4}-\d{2}-\d{2}\.json$/.test(f))
            .sort()
            .reverse();

          const index = files.map(file => {
            const raw = JSON.parse(readFileSync(join(dataDir, file), "utf8"));
            return {
              week_id: raw.week?.week_id,
              date: raw.week?.date,
              issue: raw.week?.issue,
              title: raw.week?.title,
            };
          }).filter(entry => entry.week_id);

          writeFileSync(join(dataDir, "index.json"), JSON.stringify(index, null, 2), "utf8");
          console.log(`index.json updated with ${index.length} entries`);
          JSEOF

      - name: Commit and push index.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bulletin/data/index.json
          git diff --cached --quiet || git commit -m "chore: auto-update bulletin index.json [skip ci]"
          git push
