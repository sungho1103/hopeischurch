<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>주일 설교 | 희망은교회</title>

  <!-- ✅ 모든 페이지 공통 레이아웃 -->
<link rel="stylesheet" href="/hopeischurch/assets/common.css?v=20260203-01">

  <!-- ✅ 설교 페이지 전용 스타일: 반드시 page scope로 격리 -->
  <style>
    /* ==================================================
       Sermon Page (Scoped)
       - 공통 헤더/상단메뉴/기본 스타일 깨짐 방지
       - 이 페이지에서만 적용되도록 .page-sermon로 스코프
    ================================================== */

    body.page-sermon .wrap{ padding-top:0; }
    body.page-sermon main{ padding:0; }
    body.page-sermon .container{ padding-top:40px; }

    @media (max-width:768px){
      body.page-sermon .wrap{ padding-top:0; }
      .page-sermon .container{ padding:10px 16px 40px; }
      .page-sermon pre{ font-size:0.8rem; }
    }

    .page-sermon .sermon-top{
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:flex-end;
      flex-wrap:wrap;
    }

    .page-sermon .muted{
      color:#666;
      font-size:0.8rem;
      line-height:1.7;
    }

    /* ❌ h1 전역 금지 → ✅ 설교 페이지 main 제목만 */
    .page-sermon main h1{
      margin:0;
      font-size:1.75rem;
      letter-spacing:-.02em;
    }

    .page-sermon .grid{
      display:grid;
      grid-template-columns: 320px 1fr;
      gap:16px;
    }

    .page-sermon .panel{
      border:1px solid #eee;
      border-radius:16px;
      padding:14px;
      background:#fff;
    }

    .page-sermon .select{
      width:100%;
      padding:10px 12px;
      border:2px solid #999;
      border-radius:12px;
      font-size:0.8rem;
      background:#fff;
    }

    .page-sermon .badge{
      display:inline-block;
      padding:4px 10px;
      border:1px solid #e6e6e6;
      border-radius:999px;
      color:#555;
      font-size:0.7rem;
      background:#fff;
    }

    .page-sermon .sermon-title{
      font-size:1.2rem;
      margin:0 0 10px;
      letter-spacing:-.02em;
    }

    .page-sermon .meta-row{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin:0 0 12px;
    }

    .page-sermon pre{
      margin:0;
      white-space:pre-wrap;
      word-break:break-word;
      font-size:0.85rem;
      line-height:1.8;
      font-family:inherit;
    }

    @media (max-width: 980px){
      .page-sermon .grid{ grid-template-columns: 1fr; }
    }
  </style>
</head>

<body class="page-sermon">
  <!-- 모바일 Sticky Header -->
  <header class="mobile-header">
    <span class="mobile-brand">희망은교회</span>
    <button class="hamburger" id="hamburgerBtn" aria-label="메뉴 열기">
      <span></span><span></span><span></span>
    </button>
  </header>
  <div class="drawer-overlay" id="drawerOverlay"></div>
  <nav class="drawer" id="drawer">
    <button class="drawer-close" id="drawerClose" aria-label="메뉴 닫기">×</button>
    <a href="/hopeischurch/" data-nav="home">홈</a>
    <a href="/hopeischurch/bulletin/" data-nav="bulletin">주보</a>
    <a href="/hopeischurch/sermon/" data-nav="sermon">주일설교</a>
    <a href="/hopeischurch/#map" data-nav="map">찾아오는 길</a>
  </nav>
  <div class="mobile-notice" id="mobileNotice"></div>

  <div class="wrap">
    <aside>
      <div class="brand">희망은교회</div>

      <nav id="menu">
        <a href="/hopeischurch/" data-nav="home">홈</a>
        <a href="/hopeischurch/bulletin/" data-nav="bulletin">주보</a>
        <a href="/hopeischurch/sermon/" data-nav="sermon">주일설교</a>
        <a href="/hopeischurch/#map" data-nav="map">찾아오는 길</a>
      </nav>

      <div class="notice" id="siteNotice"></div>
    </aside>

    <main>
      <div class="container">
        <div class="sermon-top">
          <div>
            <h1>주일 설교</h1>
            <div class="muted">설교문은 주마다 업데이트됩니다.</div>
          </div>
          <div class="muted" id="status">불러오는 중…</div>
        </div>

        <hr style="margin-top:28px;"/>

        <div class="grid" style="margin-top:28px;">
          <section class="panel">
            <div class="muted" style="margin-bottom:10px;">설교 목록</div>

            <!-- ✅ 드롭다운 -->
            <select class="select" id="select">
              <option>불러오는 중…</option>
            </select>

            <!-- 주차별 사진 -->
            <div id="sermonImg" style="display:none;margin-top:24px;">
              <img id="sermonImgEl" src="" alt="" style="width:100%;border-radius:10px;display:block;object-fit:cover;">
            </div>

          </section>

          <section class="panel" id="viewer">
            <div class="muted">왼쪽에서 설교를 선택하세요.</div>
          </section>
        </div>
      </div>
    </main>
  </div>

<!-- 모바일 하단 탭바 -->
<nav class="bottom-nav">
  <a href="/hopeischurch/" class="bottom-nav-item" data-nav="home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/><path d="M9 21V12h6v9"/>
    </svg>
    <span>홈</span>
  </a>
  <a href="/hopeischurch/bulletin/" class="bottom-nav-item" data-nav="bulletin">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h8M8 15h5"/>
    </svg>
    <span>주보</span>
  </a>
  <a href="/hopeischurch/sermon/" class="bottom-nav-item" data-nav="sermon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/>
    </svg>
    <span>설교</span>
  </a>
  <a href="/hopeischurch/#map" class="bottom-nav-item" data-nav="map">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/>
    </svg>
    <span>위치</span>
  </a>
</nav>

<script>
  // 모바일 햄버거 메뉴
  (function(){
    const btn=document.getElementById('hamburgerBtn'),overlay=document.getElementById('drawerOverlay'),drawer=document.getElementById('drawer'),closeBtn=document.getElementById('drawerClose');
    if(!btn) return;
    function open(){ drawer.classList.add('open'); overlay.classList.add('open'); document.body.style.overflow='hidden'; }
    function close(){ drawer.classList.remove('open'); overlay.classList.remove('open'); document.body.style.overflow=''; }
    btn.addEventListener('click',open); closeBtn.addEventListener('click',close); overlay.addEventListener('click',close);
  })();

  // 하단 탭바 + 드로어 active 상태
  (function(){
    const path=location.pathname;
    document.querySelectorAll('.bottom-nav-item[data-nav], .drawer a[data-nav], #menu a[data-nav]').forEach(el=>{
      const nav=el.dataset.nav;
      if((nav==='bulletin'&&path.includes('/bulletin/'))||(nav==='sermon'&&path.includes('/sermon/')))
        el.classList.add('is-active');
    });
  })();

  // 공지사항 동적 로드
  fetch('/hopeischurch/data/notice.json',{cache:'no-store'})
    .then(r=>r.json()).then(n=>{
      const el=document.getElementById('siteNotice');
      if(el){ const items=n.items||[]; if(items.length){ el.innerHTML=items.map(item=>{ let line=escapeHtml(item.text||'').replace(/\n/g,'<br>'); if(item.link_url) line+=` <a href="${escapeHtml(item.link_url)}" target="_blank" rel="noreferrer">${escapeHtml(item.link_text||item.link_url)}</a>`; return `<div class="notice-item">${line}</div>`; }).join(''); } }
      const mob=document.getElementById('mobileNotice'); if(!mob) return;
      const items=n.items||[]; if(!items.length) return;
      mob.innerHTML=items.map(item=>`<div class="mobile-notice-item">${escapeHtml(item.text||'').replace(/\n/g,'<br>')}</div>`).join('');
      mob.classList.add('has-items');
    }).catch(()=>{});

  // ✅ 안정적: GitHub API 대신 "우리 사이트"의 정적 파일을 읽음
  const LIST_URL  = "/hopeischurch/sermon/texts/index.json";
  const TEXT_BASE = "/hopeischurch/sermon/texts/";

  const selectEl = document.getElementById("select");
  const viewerEl = document.getElementById("viewer");
  const statusEl = document.getElementById("status");

  const qs = new URLSearchParams(location.search);
  const currentFile = qs.get("file"); // 예: 2026-02-02.txt

  function escapeHtml(s){
    return String(s ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function parseSermonTxt(txt){
    const lines = txt.replace(/\r\n/g, "\n").split("\n");
    const meta = {};
    let i = 0;

    for(; i < lines.length; i++){
      const line = lines[i].trim();
      if(line === "") { i++; break; }
      const m = line.match(/^([^:]+)\s*:\s*(.*)$/);
      if(m) meta[m[1].trim()] = m[2].trim();
    }

    const body = lines.slice(i).join("\n").trim();
    return { meta, body };
  }

  function formatTitleFromFilename(name){
    return name.replace(/\.txt$/i, "");
  }

  function setFileParam(filename){
    const u = new URL(location.href);
    u.searchParams.set("file", filename);
    location.href = u.toString();
  }

  async function fetchJSON(url){
    const res = await fetch(url, { cache:"no-store" });
    if(!res.ok) throw new Error(`JSON fetch failed: ${res.status}`);
    return await res.json();
  }

  async function fetchText(url){
    const res = await fetch(url, { cache:"no-store" });
    if(!res.ok) throw new Error(`TXT fetch failed: ${res.status}`);
    return await res.text();
  }

  async function loadList(){
    const data = await fetchJSON(LIST_URL);
    const files = (data.files || [])
      .filter(name => /\.txt$/i.test(name))
      .sort((a,b) => b.localeCompare(a));

    if(!files.length){
      selectEl.innerHTML = `<option>(설교 파일 없음)</option>`;
      statusEl.textContent = "목록 없음";
      return { files, selected: null };
    }

    const selected = (currentFile && files.includes(currentFile)) ? currentFile : files[0];

    selectEl.innerHTML = files.map(name => {
      const label = formatTitleFromFilename(name);
      const sel = (name === selected) ? "selected" : "";
      return `<option value="${escapeHtml(name)}" ${sel}>${escapeHtml(label)}</option>`;
    }).join("");

    statusEl.textContent = `총 ${files.length}개`;
    return { files, selected };
  }

  async function renderFile(filename){
    viewerEl.innerHTML = `<div class="muted">불러오는 중…</div>`;

    const url = TEXT_BASE + encodeURIComponent(filename);
    const txt = await fetchText(url);

    const { meta, body } = parseSermonTxt(txt);

    const title  = meta["제목"] || meta["title"] || formatTitleFromFilename(filename);
    const date   = meta["날짜"] || meta["date"] || formatTitleFromFilename(filename);
    const ref    = meta["본문"] || meta["text"] || "";
    const who    = meta["설교자"] || meta["preacher"] || "";
    const imgSrc = meta["이미지"] || meta["image"] || "";

    const imgDiv = document.getElementById("sermonImg");
    const imgEl  = document.getElementById("sermonImgEl");
    if (imgSrc) { imgEl.src = imgSrc; imgDiv.style.display = ""; }
    else        { imgDiv.style.display = "none"; imgEl.src = ""; }

    viewerEl.innerHTML = `
      <div class="muted" style="margin-bottom:6px;">${escapeHtml(date)}</div>
      <h2 class="sermon-title">${escapeHtml(title)}</h2>
      <div class="meta-row">
        ${ref ? `<span class="badge">본문: ${escapeHtml(ref)}</span>` : ""}
        ${who ? `<span class="badge">설교자: ${escapeHtml(who)}</span>` : ""}
        <span class="badge">파일: ${escapeHtml(filename)}</span>
      </div>
      <pre>${escapeHtml(body || "(본문이 비어 있습니다)")}</pre>
    `;
  }

  selectEl.addEventListener("change", () => {
    const filename = selectEl.value;
    if(filename) setFileParam(filename);
  });

  (async function main(){
    try{
      const { selected } = await loadList();
      if(selected) await renderFile(selected);
    }catch(err){
      console.error(err);
      statusEl.textContent = "불러오기 실패";
      viewerEl.innerHTML = `
        <div class="muted">
          설교를 불러오지 못했습니다.<br/><br/>
          <span class="badge">오류</span> ${escapeHtml(err.message)}<br/>
          <span class="badge">LIST</span> ${escapeHtml(LIST_URL)}<br/>
          <span class="badge">TEXT</span> ${escapeHtml(TEXT_BASE)}YYYY-MM-DD.txt
        </div>
      `;
    }
  })();
</script>
</body>
</html>
