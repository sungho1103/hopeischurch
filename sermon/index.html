<script>
  // 모바일 햄버거 메뉴
  (function(){
    const btn=document.getElementById('hamburgerBtn'),overlay=document.getElementById('drawerOverlay'),drawer=document.getElementById('drawer'),closeBtn=document.getElementById('drawerClose');
    if(!btn) return;
    function open(){ drawer.classList.add('open'); overlay.classList.add('open'); document.body.style.overflow='hidden'; }
    function close(){ drawer.classList.remove('open'); overlay.classList.remove('open'); document.body.style.overflow=''; }
    btn.addEventListener('click',open); closeBtn.addEventListener('click',close); overlay.addEventListener('click',close);
  })();

  // 하단 탭바 + 드로어 active 상태
  (function(){
    const path=location.pathname;
    document.querySelectorAll('.bottom-nav-item[data-nav], .drawer a[data-nav], #menu a[data-nav]').forEach(el=>{
      const nav=el.dataset.nav;
      if((nav==='bulletin'&&path.includes('/bulletin/'))||(nav==='sermon'&&path.includes('/sermon/')))
        el.classList.add('is-active');
    });
  })();

  // 공지사항 동적 로드
  fetch('/hopeischurch/data/notice.json',{cache:'no-store'})
    .then(r=>r.json()).then(n=>{
      const el=document.getElementById('siteNotice');
      if(el){ const items=n.items||[]; if(items.length){ el.innerHTML=items.map(item=>{ let line=escapeHtml(item.text||'').replace(/\n/g,'<br>'); if(item.link_url) line+=` <a href="${escapeHtml(item.link_url)}" target="_blank" rel="noreferrer">${escapeHtml(item.link_text||item.link_url)}</a>`; return `<div class="notice-item">${line}</div>`; }).join(''); } }
      const mob=document.getElementById('mobileNotice'); if(!mob) return;
      const items=n.items||[]; if(!items.length) return;
      mob.innerHTML=items.map(item=>`<div class="mobile-notice-item">${escapeHtml(item.text||'').replace(/\n/g,'<br>')}</div>`).join('');
      mob.classList.add('has-items');
    }).catch(()=>{});

  // ✅ 안정적: GitHub API 대신 "우리 사이트"의 정적 파일을 읽음
  const LIST_URL  = "/hopeischurch/sermon/texts/index.json";
  const TEXT_BASE = "/hopeischurch/sermon/texts/";

  const selectEl = document.getElementById("select");
  const viewerEl = document.getElementById("viewer");
  const statusEl = document.getElementById("status");

  const qs = new URLSearchParams(location.search);
  const currentFile = qs.get("file"); // 예: 2026-02-02.txt

  function escapeHtml(s){
    return String(s ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function parseSermonTxt(txt){
    const lines = txt.replace(/\r\n/g, "\n").split("\n");
    const meta = {};
    let i = 0;

    for(; i < lines.length; i++){
      const line = lines[i].trim();
      if(line === "") { i++; break; }
      const m = line.match(/^([^:]+)\s*:\s*(.*)$/);
      if(m) meta[m[1].trim()] = m[2].trim();
    }

    const body = lines.slice(i).join("\n").trim();
    return { meta, body };
  }

  function formatTitleFromFilename(name){
    return name.replace(/\.txt$/i, "");
  }

  function setFileParam(filename){
    const u = new URL(location.href);
    u.searchParams.set("file", filename);
    location.href = u.toString();
  }

  async function fetchJSON(url){
    const res = await fetch(url, { cache:"no-store" });
    if(!res.ok) throw new Error(`JSON fetch failed: ${res.status}`);
    return await res.json();
  }

  async function fetchText(url){
    const res = await fetch(url, { cache:"no-store" });
    if(!res.ok) throw new Error(`TXT fetch failed: ${res.status}`);
    return await res.text();
  }

  async function loadList(){
    const data = await fetchJSON(LIST_URL);
    const files = (data.files || [])
      .filter(name => /\.txt$/i.test(name))
      .sort((a,b) => b.localeCompare(a));

    if(!files.length){
      selectEl.innerHTML = `<option>(설교 파일 없음)</option>`;
      statusEl.textContent = "목록 없음";
      return { files, selected: null };
    }

    const selected = (currentFile && files.includes(currentFile)) ? currentFile : files[0];

    selectEl.innerHTML = files.map(name => {
      const label = formatTitleFromFilename(name);
      const sel = (name === selected) ? "selected" : "";
      return `<option value="${escapeHtml(name)}" ${sel}>${escapeHtml(label)}</option>`;
    }).join("");

    statusEl.textContent = `총 ${files.length}개`;
    return { files, selected };
  }

  async function renderFile(filename){
    viewerEl.innerHTML = `<div class="muted">불러오는 중…</div>`;

    const url = TEXT_BASE + encodeURIComponent(filename);
    const txt = await fetchText(url);

    const { meta, body } = parseSermonTxt(txt);

    const title  = meta["제목"] || meta["title"] || formatTitleFromFilename(filename);
    const date   = meta["날짜"] || meta["date"] || formatTitleFromFilename(filename);
    const ref    = meta["본문"] || meta["text"] || "";
    const who    = meta["설교자"] || meta["preacher"] || "";
    const imgSrc = meta["이미지"] || meta["image"] || "";

    const imgDiv = document.getElementById("sermonImg");
    const imgEl  = document.getElementById("sermonImgEl");
    if (imgSrc) { imgEl.src = imgSrc; imgDiv.style.display = ""; }
    else        { imgDiv.style.display = "none"; imgEl.src = ""; }

    viewerEl.innerHTML = `
      <div class="muted" style="margin-bottom:6px;">${escapeHtml(date)}</div>
      <h2 class="sermon-title">${escapeHtml(title)}</h2>
      <div class="meta-row">
        ${ref ? `<span class="badge">본문: ${escapeHtml(ref)}</span>` : ""}
        ${who ? `<span class="badge">설교자: ${escapeHtml(who)}</span>` : ""}
        <span class="badge">파일: ${escapeHtml(filename)}</span>
      </div>
      <pre>${escapeHtml(body || "(본문이 비어 있습니다)")}</pre>
    `;
    document.dispatchEvent(new CustomEvent("sermonLoaded", { detail: { file: filename } }));
  }

  selectEl.addEventListener("change", () => {
    const filename = selectEl.value;
    if(filename) setFileParam(filename);
  });

  (async function main(){
    try{
      const { selected } = await loadList();
      if(selected) await renderFile(selected);
    }catch(err){
      console.error(err);
      statusEl.textContent = "불러오기 실패";
      viewerEl.innerHTML = `
        <div class="muted">
          설교를 불러오지 못했습니다.<br/><br/>
          <span class="badge">오류</span> ${escapeHtml(err.message)}<br/>
          <span class="badge">LIST</span> ${escapeHtml(LIST_URL)}<br/>
          <span class="badge">TEXT</span> ${escapeHtml(TEXT_BASE)}YYYY-MM-DD.txt
        </div>
      `;
    }
  })();
</script>

<script type="module">
const FB = {
  apiKey:            "AIzaSyCTS7eCGaNcuo9dKX-nYF-flNUlAC4dopM",
  authDomain:        "hopeischurch-sermon.firebaseapp.com",

  projectId:         "hopeischurch-sermon",
  storageBucket:     "hopeischurch-sermon.firebasestorage.app",
  messagingSenderId: "423981952872",
  appId:             "1:423981952872:web:6c7a337334a42c4bde30dd",
};

// ✏️ 관리자 비밀번호 — 원하는 값으로 변경하세요
const ADMIN_PW = "hope2026!";

import { initializeApp }                        from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

let db;
try { db = getDatabase(initializeApp(FB)); }
catch(e){ console.warn("Firebase 오류:", e.message); }

const wrap    = document.getElementById("commentsWrap");
const listEl  = document.getElementById("commentList");
const nameEl  = document.getElementById("cName");
const pwEl    = document.getElementById("cPw");
const textEl  = document.getElementById("cText");
const countEl = document.getElementById("cCount");
const errorEl = document.getElementById("cError");
const submitEl= document.getElementById("cSubmit");

textEl.addEventListener("input", () => {
  countEl.textContent = `${textEl.value.length} / 100`;
});

function esc(s){
  return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

async function sha256(str){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

let cache = {};
let unsub  = null;
let curFile = "";

function fileKey(f){ return f.replace(/[\.\#\$\[\]\/]/g,"_"); }

function loadComments(file){
  if(!db) return;
  curFile = file;
  wrap.style.display = "";
  if(unsub) unsub();
  cache = {};
  unsub = onValue(ref(db, `sermon_comments/${fileKey(file)}`), snap => {
    cache = snap.val() || {};
    render();
  });
}

function render(){
  const items = Object.entries(cache)
    .map(([id,v]) => ({id,...v}))
    .sort((a,b) => a.ts - b.ts);

  if(!items.length){
    listEl.innerHTML = '<div class="c-empty">첫 번째 댓글을 남겨주세요.</div>';
    return;
  }
  listEl.innerHTML = items.map(c => {
    const d  = new Date(c.ts);
    const dt = `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
    return `<div class="comment-item">
      <div class="comment-meta">
        <span class="comment-author">${esc(c.name)}</span> · ${dt}
        <button class="c-del" data-id="${esc(c.id)}" data-hash="${esc(c.pwHash||'')}">×</button>
      </div>
      <div class="comment-body">${esc(c.text)}</div>
    </div>`;
  }).join("");

  listEl.querySelectorAll(".c-del").forEach(btn => {
    btn.addEventListener("click", () => handleDelete(btn.dataset.id, btn.dataset.hash));
  });
}

async function handleDelete(id, storedHash){
  const entered = window.prompt("비밀번호를 입력하세요\n(작성 시 비밀번호 또는 관리자 비밀번호)");
  if(entered === null) return;
  const enteredHash = await sha256(entered);
  const adminHash   = await sha256(ADMIN_PW);
  if(enteredHash !== storedHash && enteredHash !== adminHash){
    alert("비밀번호가 맞지 않습니다.");
    return;
  }
  try {
    await remove(ref(db, `sermon_comments/${fileKey(curFile)}/${id}`));
  } catch(e){
    alert("삭제에 실패했습니다.");
  }
}

function validate(name, pw, text){
  if(!name.trim()) return "이름을 입력해주세요.";
  if(!pw.trim())   return "비밀번호를 입력해주세요.";
  if(!text.trim()) return "내용을 입력해주세요.";
  if(text.length > 100) return "100자 이내로 작성해주세요.";

  const items = Object.values(cache).sort((a,b) => a.ts - b.ts);

  if(items.some(c => c.text.trim() === text.trim()))
    return "이미 동일한 내용의 댓글이 있습니다.";

  const last2 = items.slice(-2);
  if(last2.length === 2 && last2.every(c => c.name.trim() === name.trim()))
    return "같은 분이 연속으로 3번 이상 댓글을 달 수 없습니다.";

  return null;
}

submitEl.addEventListener("click", async () => {
  const name = nameEl.value.trim();
  const pw   = pwEl.value;
  const text = textEl.value.trim();
  const err  = validate(name, pw, text);
  if(err){ errorEl.textContent = err; return; }
  errorEl.textContent = "";
  submitEl.disabled = true;
  try {
    const pwHash = await sha256(pw);
    await push(ref(db, `sermon_comments/${fileKey(curFile)}`), { name, text, ts: Date.now(), pwHash });
    textEl.value = "";
    pwEl.value   = "";
    countEl.textContent = "0 / 100";
  } catch(e){
    errorEl.textContent = "저장에 실패했습니다.";
  } finally {
    submitEl.disabled = false;
  }
});

document.addEventListener("sermonLoaded", e => loadComments(e.detail.file));
</script>
</body>
</html>
