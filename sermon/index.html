<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>주일 설교 | 희망은교회</title>
  <link rel="stylesheet" href="./assets/common.css">

</head>
<body>
  <div class="wrap">
    <aside>
  <div class="brand">희망은교회</div>

  <nav id="menu">
    <a href="../" data-nav="home">홈</a>
    <a href="#worship" data-nav="worship">예배 시간</a>
    <a href="#pastor" data-nav="pastor">섬기는 이들</a>
    <a href="../bulletin/" data-nav="bulletin">주보 보기</a>
    <a href="#map" data-nav="map">찾아오는 길</a>
    <a href="../sermon/" data-nav="sermon">주일 설교</a>
  </nav>

  <div class="notice">
    <strong>행사</strong>
    <span>성경암송대회(2/22)</span>
    <a href="https://goodtvbible.goodtv.co.kr/onbibleread/0/19/42" target="_blank">시편42편</a>
  </div>
</aside>


    <main>
      <div class="container">
        <div class="top">
          <div>
            <h1>주일 설교</h1>
            <div class="muted">설교문은 주마다 업데이트됩니다. </div>
          </div>
          <div class="muted" id="status">불러오는 중…</div>
        </div>

        <hr/>

        <div class="grid">
       <section class="panel">
  <div class="toggle-head">
    <div class="muted" style="margin:0;">설교 목록</div>

    <button
      class="toggle-btn"
      id="sermonToggleBtn"
      type="button"
      aria-expanded="false"
      aria-controls="sermonToggleBody"
    >
      <span id="sermonToggleLabel">날짜 선택</span>
      <span class="chev" aria-hidden="true">▾</span>
    </button>
  </div>

  <div class="toggle-body" id="sermonToggleBody" hidden>
    <div class="list" id="list"></div>
  </div>

  <hr/>
  <div class="muted">
    파일 추가 방법: <br/>
    <span class="badge">sermon/texts/2026-02-01.txt</span> file upload
  </div>
</section>


          <section class="panel" id="viewer">
            <div class="muted">왼쪽에서 설교를 선택하세요.</div>
          </section>
        </div>
      </div>
    </main>
  </div>

<script>
  // ✅ 당신 GitHub 정보(고정)
  const OWNER = "sungho1103";
  const REPO  = "hopeischurch";
  const BRANCH = "main";
  const TEXTS_PATH = "sermon/texts"; // 폴더

  // 목록: GitHub Contents API로 폴더 파일 목록 가져오기
  const LIST_API = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${TEXTS_PATH}?ref=${BRANCH}`;
  // raw 텍스트 가져오기
  const RAW_BASE = `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${TEXTS_PATH}/`;

  const listEl = document.getElementById("list");
  const viewerEl = document.getElementById("viewer");
  const statusEl = document.getElementById("status");

  const toggleBtn = document.getElementById("sermonToggleBtn");
const toggleBody = document.getElementById("sermonToggleBody");
const toggleLabel = document.getElementById("sermonToggleLabel");


  const qs = new URLSearchParams(location.search);
  const currentFile = qs.get("file"); // 예: 2026-02-01.txt

  function escapeHtml(s){
    return String(s ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function setFileParam(filename){
    const u = new URL(location.href);
    u.searchParams.set("file", filename);
    location.href = u.toString();
  }

  function parseSermonTxt(txt){
    // 첫 "빈 줄" 전까지를 메타 라인으로 간주 (예: "제목: ...")
    const lines = txt.replace(/\r\n/g, "\n").split("\n");

    const meta = {};
    let i = 0;
    for(; i < lines.length; i++){
      const line = lines[i].trim();
      if(line === "") { i++; break; }
      const m = line.match(/^([^:]+)\s*:\s*(.*)$/);
      if(m){
        meta[m[1].trim()] = m[2].trim();
      }
    }

    const body = lines.slice(i).join("\n").trim();
    return { meta, body };
  }

  function formatTitleFromFilename(name){
    // 파일명 2026-02-01.txt -> 2026-02-01
    return name.replace(/\.txt$/i, "");
  }

  async function fetchJSON(url){
    const res = await fetch(url);
    if(!res.ok) throw new Error(`fetch failed: ${res.status}`);
    return await res.json();
  }

  async function fetchText(url){
    const res = await fetch(url);
    if(!res.ok) throw new Error(`fetch failed: ${res.status}`);
    return await res.text();
  }

function openToggle(){
  toggleBtn.setAttribute("aria-expanded", "true");
  toggleBody.hidden = false;
}

function closeToggle(){
  toggleBtn.setAttribute("aria-expanded", "false");
  toggleBody.hidden = true;
}

toggleBtn.addEventListener("click", () => {
  const expanded = toggleBtn.getAttribute("aria-expanded") === "true";
  expanded ? closeToggle() : openToggle();
});

  
  async function loadList(){
    const data = await fetchJSON(LIST_API);
    const files = (Array.isArray(data) ? data : [])
      .filter(x => x.type === "file" && /\.txt$/i.test(x.name))
      .map(x => x.name)
      // 날짜 파일명 기준 내림차순 (최신이 위)
      .sort((a,b) => b.localeCompare(a));

    if(!files.length){
      listEl.innerHTML = `<div class="muted">아직 설교 txt 파일이 없습니다.</div>`;
      statusEl.textContent = "목록 없음";
      return { files, selected: null };
    }

    const selected = (currentFile && files.includes(currentFile)) ? currentFile : files[0];

toggleLabel.textContent = formatTitleFromFilename(selected);
closeToggle();

    
    listEl.innerHTML = files.map(name => {
  const active = (name === selected) ? "active" : "";
  return `<a class="${active}" href="./?file=${encodeURIComponent(name)}">
    ${escapeHtml(formatTitleFromFilename(name))}
  </a>`;
}).join("");

    statusEl.textContent = `총 ${files.length}개`;
    return { files, selected };
  }

  async function renderFile(filename){
    viewerEl.innerHTML = `<div class="muted">불러오는 중…</div>`;

    const txt = await fetchText(RAW_BASE + encodeURIComponent(filename));
    const { meta, body } = parseSermonTxt(txt);

    const title = meta["제목"] || meta["title"] || formatTitleFromFilename(filename);
    const date  = meta["날짜"] || meta["date"] || formatTitleFromFilename(filename);
    const ref   = meta["본문"] || meta["text"] || "";
    const who   = meta["설교자"] || meta["preacher"] || "";

    viewerEl.innerHTML = `
      <div class="muted" style="margin-bottom:6px;">${escapeHtml(date)}</div>
      <h2 class="sermon-title">${escapeHtml(title)}</h2>
      <div class="meta-row">
        ${ref ? `<span class="badge">본문: ${escapeHtml(ref)}</span>` : ""}
        ${who ? `<span class="badge">설교자: ${escapeHtml(who)}</span>` : ""}
        <span class="badge">파일: ${escapeHtml(filename)}</span>
      </div>
      <pre>${escapeHtml(body || "(본문이 비어 있습니다)")}</pre>
    `;
  }

  (async function main(){
    try{
      const { selected } = await loadList();
      if(selected) await renderFile(selected);
    }catch(err){
      console.error(err);
      statusEl.textContent = "불러오기 실패";
      viewerEl.innerHTML = `
        <div class="muted">
          설교 목록을 불러오지 못했습니다.<br/>
          - GitHub에 <b>sermon/texts</b> 폴더가 있는지<br/>
          - 저장소가 Public인지<br/>
          를 확인해주세요.
        </div>
      `;
    }
  })();
</script>
</body>
</html>
