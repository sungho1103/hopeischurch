<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>주일 설교 | 희망은교회</title>

  <!-- 공통 레이아웃 -->
  <link rel="stylesheet" href="/hopeischurch/assets/common.css?v=20260203-01">

  <style>
    /* ==================================================
       Sermon Page (Scoped)
       ================================================== */
    .page-sermon main{
      background:#f3f5f9;
    }

    .page-sermon .sermon-top{
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:flex-end;
      flex-wrap:wrap;
      margin-bottom:16px;
    }

    .page-sermon .muted{
      color:#666;
      font-size:14px;
      line-height:1.7;
    }

    .page-sermon main h1{
      margin:0;
      font-size:32px;
      letter-spacing:-.02em;
    }

    .page-sermon .divider{
      height:1px;
      background:#e6e9ef;
      margin:18px 0;
    }

    .page-sermon .grid{
      display:grid;
      grid-template-columns: 320px 1fr;
      gap:16px;
    }

    /* 카드 공통 */
    .page-sermon .card{
      background:#fff;
      border-radius:16px;
      padding:18px 18px;
      box-shadow:0 6px 14px rgba(0,0,0,.06);
    }

    .page-sermon .select{
      width:100%;
      padding:10px 12px;
      border:1px solid #e6e6e6;
      border-radius:12px;
      font-size:14px;
      background:#fff;
    }

    .page-sermon .badge{
      display:inline-block;
      padding:4px 10px;
      border:1px solid #e6e6e6;
      border-radius:999px;
      color:#555;
      font-size:12px;
      background:#fff;
    }

    .page-sermon .sermon-title{
      font-size:22px;
      margin:0 0 10px;
      letter-spacing:-.02em;
    }

    .page-sermon .meta-row{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin:0 0 14px;
    }

    .page-sermon pre{
      margin:0;
      white-space:pre-wrap;
      word-break:break-word;
      font-size:15px;
      line-height:1.85;
      font-family:inherit;
      color:#333;
    }

    /* 안내 카드 */
    .page-sermon .guide{
      background:#f7f9ff;
      border-left:5px solid #4a6cf7;
      margin-top:14px;
    }

    @media (max-width: 980px){
      .page-sermon .grid{ grid-template-columns:1fr; }
    }
  </style>
</head>

<body class="page-sermon">
  <div class="wrap">
    <aside>
      <div class="brand">희망은교회</div>

      <nav id="menu">
        <a href="/hopeischurch/">홈</a>
        <a href="/hopeischurch/#worship">교회안내</a>
        <a href="/hopeischurch/bulletin/">주보</a>
        <a href="/hopeischurch/#map">찾아오는 길</a>
        <a href="/hopeischurch/sermon/">주일설교</a>
      </nav>

      <div class="notice">
        <strong>|행사|</strong>
        <span>성경암송대회(2/22)</span>
        <a href="https://goodtvbible.goodtv.co.kr/onbibleread/0/19/42" target="_blank" rel="noreferrer">시편42편</a>
      </div>
    </aside>

    <main>
      <div class="container">
        <div class="sermon-top">
          <div>
            <h1>주일 설교</h1>
            <div class="muted">설교문은 주마다 업데이트됩니다.</div>
          </div>
          <div class="muted" id="status">불러오는 중…</div>
        </div>

        <div class="divider"></div>

        <div class="grid">
          <!-- 왼쪽: 설교 목록 -->
          <section class="card">
            <div class="muted" style="margin-bottom:10px;">설교 목록</div>
            <select class="select" id="select">
              <option>불러오는 중…</option>
            </select>

            <div class="card guide">
              <div class="muted">
                파일 추가 방법<br/>
                <span class="badge">sermon/texts/2026-02-01.txt</span>
              </div>
            </div>
          </section>

          <!-- 오른쪽: 설교 본문 -->
          <section class="card" id="viewer">
            <div class="muted">왼쪽에서 설교를 선택하세요.</div>
          </section>
        </div>
      </div>
    </main>
  </div>

<script>
  const LIST_URL  = "/hopeischurch/sermon/texts/index.json";
  const TEXT_BASE = "/hopeischurch/sermon/texts/";

  const selectEl = document.getElementById("select");
  const viewerEl = document.getElementById("viewer");
  const statusEl = document.getElementById("status");

  const qs = new URLSearchParams(location.search);
  const currentFile = qs.get("file");

  function escapeHtml(s){
    return String(s ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function parseSermonTxt(txt){
    const lines = txt.replace(/\r\n/g,"\n").split("\n");
    const meta = {};
    let i=0;
    for(; i<lines.length; i++){
      const line = lines[i].trim();
      if(line===""){ i++; break; }
      const m=line.match(/^([^:]+)\s*:\s*(.*)$/);
      if(m) meta[m[1].trim()]=m[2].trim();
    }
    return { meta, body: lines.slice(i).join("\n").trim() };
  }

  async function loadList(){
    const res = await fetch(LIST_URL,{cache:"no-store"});
    const data = await res.json();
    const files=(data.files||[]).filter(f=>/\.txt$/i.test(f)).sort((a,b)=>b.localeCompare(a));
    const selected = currentFile && files.includes(currentFile) ? currentFile : files[0];
    selectEl.innerHTML = files.map(f=>`<option ${f===selected?"selected":""}>${f.replace(".txt","")}</option>`).join("");
    statusEl.textContent = `총 ${files.length}개`;
    return selected;
  }

  async function renderFile(name){
    viewerEl.innerHTML = `<div class="muted">불러오는 중…</div>`;
    const txt = await fetch(TEXT_BASE+encodeURIComponent(name),{cache:"no-store"}).then(r=>r.text());
    const {meta, body} = parseSermonTxt(txt);
    viewerEl.innerHTML = `
      <div class="muted">${escapeHtml(meta["날짜"]||"")}</div>
      <h2 class="sermon-title">${escapeHtml(meta["제목"]||name)}</h2>
      <div class="meta-row">
        ${meta["본문"]?`<span class="badge">본문: ${escapeHtml(meta["본문"])}</span>`:""}
        ${meta["설교자"]?`<span class="badge">설교자: ${escapeHtml(meta["설교자"])}</span>`:""}
      </div>
      <pre>${escapeHtml(body)}</pre>
    `;
  }

  selectEl.addEventListener("change",()=>{
    const u=new URL(location.href);
    u.searchParams.set("file",selectEl.value+".txt");
    location.href=u.toString();
  });

  (async()=>{
    const sel=await loadList();
    if(sel) await renderFile(sel);
  })();
</script>
</body>
</html>
