<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>희망은교회</title>
  <style>
    :root{ --side:220px; --max:900px; }
    body{ margin:0; font-family:system-ui,-apple-system,"Noto Sans KR",Arial; color:#111; }
    .wrap{ display:flex; min-height:100vh; }
    aside{
      width:var(--side); padding:24px 18px; border-right:1px solid #eee;
      position:sticky; top:0; height:100vh; box-sizing:border-box;
      background:#fff;
    }
    .brand{ font-weight:800; letter-spacing:-.02em; margin-bottom:12px; }
    nav a{ display:block; padding:8px 0; color:#111; text-decoration:none; }
    nav a:hover{ text-decoration:underline; }
    main{ flex:1; }
    .container{ max-width:var(--max); padding:48px 20px; margin:0 auto; }
    h1{ font-size:44px; margin:0 0 10px; letter-spacing:-.02em; }
    .sub{ color:#666; margin:0 0 28px; line-height:1.7; }
    hr{ border:0; border-top:1px solid #eee; margin:28px 0; }
    .card{ border:1px solid #eee; border-radius:16px; padding:16px; }
    @media (max-width: 840px){
      .wrap{ display:block; }
      aside{ position:static; width:auto; height:auto; border-right:0; border-bottom:1px solid #eee; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <aside>
      <div class="brand">희망은교회</div>
      <nav>
        <a href="./">홈</a>
        <a href="./bulletin/">주보</a>
        <a href="#worship">예배 및 모임 안내</a>
        <a href="#pastor">담임목사 인사말</a>
        <a href="#map">찾아오는 길</a>
      </nav>
    </aside>

    <main>
      <div class="container">
        <h1>희망은교회</h1>
        <p class="sub">주님의 말씀 안에서 함께 자라가는 공동체</p>

        <div class="card">
          <b>이번 주 주보 보기</b><br/>
          <a href="./bulletin/" style="display:inline-block; margin-top:10px;">주보 페이지로 이동 →</a>
        </div>

        <hr/>

        <section id="worship">
          <h2>예배 및 모임 안내</h2>
          <p><b>주일예배</b><br/>주일 오전 11:00 / 본당</p>
          <p><b>수요예배</b><br/>수요일 오후 7:30</p>
        </section>

        <hr/>

        <section id="pastor">
          <h2>담임목사 인사말</h2>
          <p class="sub" style="margin:0;">
            방문하신 모든 분들을 주님의 이름으로 환영합니다. <br/>
            희망은교회는 말씀과 기도로 함께 성장하는 공동체입니다.
          </p>
        </section>

        <hr/>

        <section id="map">
          <h2>찾아오는 길</h2>
          <p>주소: (주소 입력)</p>
          <p>연락처: (연락처 입력)</p>
          <p><a href="https://map.naver.com/" target="_blank" rel="noreferrer">네이버 지도 열기</a></p>
        </section>
      </div>
    </main>
  </div>
</body>
</html>
