      const backBtn=document.createElement("button"); backBtn.className="bb bb-outline btn-back"; backBtn.textContent="â ëª©ë¡ì¼ë¡"; backBtn.onclick=goList;
      main.appendChild(backBtn);
      const card=document.createElement("div"); card.className="detail-card";
      card.innerHTML="<div class='detail-header'><h2>"+(d.isPinned?"ð ":"")+esc(d.title)+"</h2><div class='detail-meta'><span>ìì±ì: <strong>"+esc(d.authorName||"ìµëª")+"</strong></span><span>"+date+upd+"</span></div></div><div class='detail-body'>"+esc(d.body).replace(/\n/g,"<br>")+"</div>";
      if(canEdit(d.authorUid)){
        const actions=document.createElement("div"); actions.className="detail-actions";
        const eb=document.createElement("button"); eb.className="bb bb-sm"; eb.textContent="ìì "; eb.onclick=()=>startEdit(pid);
        const db2=document.createElement("button"); db2.className="bb bb-sm bb-danger"; db2.textContent="ì­ì "; db2.onclick=()=>deletePost(pid,d.authorUid,d.password);
        actions.appendChild(eb); actions.appendChild(db2); card.appendChild(actions);
      }
      main.appendChild(card);
      const cmtSection=document.createElement("div"); cmtSection.className="comment-section";
      cmtSection.innerHTML="<h3>ð¬ ëê¸ <span id='cmt-count'></span></h3><div id='comment-list'></div><div class='comment-form'><input id='c-name' type='text' class='bi' placeholder='ì´ë¦ (ìµëª)'><input id='c-pass' type='password' class='bi' placeholder='ë¹ë°ë²í¸ (ì í)'><textarea id='c-body' class='bta' rows='3' placeholder='ëê¸ì ìë ¥íì¸ì...'></textarea><button class='bb' id='btn-submit-cmt'>ëê¸ ë±ë¡</button></div>";
      main.appendChild(cmtSection);
      document.getElementById("c-name").value=dcn;
      document.getElementById("btn-submit-cmt").onclick=()=>submitComment(pid);
      loadComments(pid);
    }

    async function startEdit(pid) {
      const ps=await getDoc(doc(db,"posts",pid)); if(!ps.exists())return;
      const d=ps.data();
      if(!canEdit(d.authorUid)){const pw=prompt("ë¹ë°ë²í¸ë¥¼ ìë ¥íì¸ì"); if(pw!==d.password){alert("ë¹ë°ë²í¸ê° íë¦½ëë¤.");return;}}
      showWriteForm({id:pid,...d});
    }

    async function deletePost(pid,authorUid,savedPw) {
      if(!canEdit(authorUid)){const pw=prompt("ë¹ë°ë²í¸ë¥¼ ìë ¥íì¸ì"); if(pw!==savedPw){alert("ë¹ë°ë²í¸ê° íë¦½ëë¤.");return;}}
      if(!confirm("ì ë§ ì­ì íìê² ìµëê¹?"))return;
      try {
        const cs=await getDocs(collection(db,"posts",pid,"comments"));
        for(const c of cs.docs) await deleteDoc(c.ref);
        await deleteDoc(doc(db,"posts",pid)); alert("ì­ì ëììµëë¤."); goList();
      } catch(e){alert("ì­ì  ì¤í¨: "+e.message);}
    }

    /* ââ ëê¸ ââ */
    function loadComments(pid) {
      const q=query(collection(db,"posts",pid,"comments"),orderBy("createdAt","asc"));
      onSnapshot(q, snap=>{
        const ce=document.getElementById("cmt-count"); if(ce) ce.textContent="("+snap.size+")";
        const list=document.getElementById("comment-list"); if(!list)return;
        list.innerHTML="";
        if(snap.empty){list.innerHTML="<p class='no-comment'>ìì§ ëê¸ì´ ììµëë¤.</p>";return;}
        snap.docs.forEach(cd=>{
          const c=cd.data(); const cdate=c.createdAt?c.createdAt.toDate().toLocaleString("ko-KR"):"";
          const item=document.createElement("div"); item.className="comment-item";
          const meta=document.createElement("div"); meta.className="cmt-meta";
          const strong=document.createElement("strong"); strong.textContent=c.authorName||"ìµëª";
          const ds=document.createElement("span"); ds.textContent=cdate;
          const db3=document.createElement("button"); db3.className="bb bb-xs bb-danger"; db3.textContent="ì­ì ";
          db3.onclick=()=>deleteComment(pid,cd.id,c.authorUid||"",c.password||"");
          meta.appendChild(strong); meta.appendChild(ds); meta.appendChild(db3);
          const body=document.createElement("div"); body.className="cmt-body";
          body.innerHTML=esc(c.body).replace(/\n/g,"<br>");
          item.appendChild(meta); item.appendChild(body); list.appendChild(item);
        });
      });
    }

    async function submitComment(pid) {
      const name=document.getElementById("c-name").value.trim()||"ìµëª";
      const pass=document.getElementById("c-pass").value;
      const body=document.getElementById("c-body").value.trim();
      if(!body){alert("ëê¸ ë´ì©ì ìë ¥í´ì£¼ì¸ì.");return;}
      try {
        await addDoc(collection(db,"posts",pid,"comments"),{authorName:name,authorUid:currentUser?currentUser.uid:null,password:pass||null,body,createdAt:serverTimestamp()});
        const pr=doc(db,"posts",pid); const ps=await getDoc(pr);
        await updateDoc(pr,{commentCount:(ps.data().commentCount||0)+1});
        document.getElementById("c-body").value="";
      } catch(e){alert("ëê¸ ë±ë¡ ì¤í¨: "+e.message);}
    }

    async function deleteComment(pid,cid,auid,pw) {
      const canDel=currentUser&&(currentUser.uid===auid||isAdmin());
      if(!canDel){const p=prompt("ë¹ë°ë²í¸ë¥¼ ìë ¥íì¸ì"); if(p!==pw){alert("ë¹ë°ë²í¸ê° íë¦½ëë¤.");return;}}
      if(!confirm("ëê¸ì ì­ì íìê² ìµëê¹?"))return;
      try {
        await deleteDoc(doc(db,"posts",pid,"comments",cid));
        const pr=doc(db,"posts",pid); const ps=await getDoc(pr);
        const cnt=(ps.data().commentCount||1)-1;
        await updateDoc(pr,{commentCount:cnt<0?0:cnt});
      } catch(e){alert("ëê¸ ì­ì  ì¤í¨: "+e.message);}
    }

    const goList=()=>{currentPostId=null;renderPostList();};
    renderAuthBar(); renderPostList();
  </script>

  <script>

    (function(){
