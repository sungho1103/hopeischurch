<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>관리자 | 희망은교회</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif; font-size: 14px; background: #f5f5f5; color: #111; line-height: 1.6; }
    a { color: inherit; }

    /* ── Login ── */
    #loginScreen {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; background: #f5f5f5;
    }
    .login-card {
      background: #fff; border: 1px solid #e0e0e0; border-radius: 12px;
      padding: 40px 36px; width: 320px; text-align: center;
    }
    .login-card h1 { font-size: 1.3rem; font-weight: 800; margin-bottom: 6px; }
    .login-card p  { font-size: .85rem; color: #888; margin-bottom: 28px; }
    .login-card input {
      width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px;
      font-size: 14px; margin-bottom: 12px; outline: none;
    }
    .login-card input:focus { border-color: #333; }
    .login-card button {
      width: 100%; padding: 11px; background: #111; color: #fff;
      border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .login-card button:hover { background: #333; }

    /* ── Admin shell ── */
    #adminApp { display: none; min-height: 100vh; }
    .admin-header {
      background: #111; color: #fff; padding: 0 24px;
      display: flex; align-items: center; justify-content: space-between;
      height: 52px; position: sticky; top: 0; z-index: 100;
    }
    .admin-brand { font-weight: 700; font-size: .95rem; }
    .header-btns { display: flex; gap: 8px; }
    .header-btns button {
      padding: 6px 14px; border-radius: 6px; font-size: 12px; cursor: pointer;
      background: transparent; color: #ccc; border: 1px solid #444;
    }
    .header-btns button:hover { background: #222; color: #fff; }

    /* ── Tab bar ── */
    .tab-bar {
      background: #fff; border-bottom: 1px solid #e0e0e0;
      display: flex; padding: 0 24px; gap: 0;
    }
    .tab-btn {
      padding: 14px 20px; border: none; background: transparent;
      font-size: 13px; font-weight: 600; color: #888; cursor: pointer;
      border-bottom: 2px solid transparent; margin-bottom: -1px;
    }
    .tab-btn:hover { color: #333; }
    .tab-btn.active { color: #111; border-bottom-color: #111; }

    /* ── Body ── */
    .admin-body { max-width: 900px; margin: 0 auto; padding: 28px 20px 60px; }

    /* ── Section headings ── */
    .tab-pane h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 20px; }

    /* ── Forms ── */
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; color: #555; margin-bottom: 6px; letter-spacing: .02em; text-transform: uppercase; }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%; padding: 9px 12px; border: 1px solid #ddd; border-radius: 8px;
      font-size: 13px; font-family: inherit; outline: none; background: #fff;
    }
    .form-group input:focus, .form-group textarea:focus { border-color: #555; }
    .form-group textarea { resize: vertical; }
    .form-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }

    /* ── Buttons ── */
    .btn-save {
      margin-top: 20px; padding: 11px 28px; background: #111; color: #fff;
      border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .btn-save:hover { background: #333; }
    .btn-add {
      margin-top: 10px; padding: 7px 16px; background: #fff; color: #333;
      border: 1px solid #ccc; border-radius: 6px; font-size: 12px; cursor: pointer;
    }
    .btn-add:hover { background: #f5f5f5; }
    .btn-del {
      padding: 4px 10px; background: #fff; color: #c00;
      border: 1px solid #e0c0c0; border-radius: 4px; font-size: 11px; cursor: pointer;
    }
    .btn-del:hover { background: #fff5f5; }
    .btn-icon {
      padding: 4px 8px; background: #fff; color: #666;
      border: 1px solid #ddd; border-radius: 4px; font-size: 12px; cursor: pointer;
    }
    .btn-icon:hover { background: #f5f5f5; }

    /* ── Card ── */
    .card {
      background: #fff; border: 1px solid #e4e4e4; border-radius: 12px;
      padding: 20px 20px; margin-bottom: 20px;
    }
    .card-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 16px;
    }
    .card-title { font-size: .9rem; font-weight: 700; }

    /* ── Tables ── */
    .data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .data-table th {
      background: #fafafa; padding: 8px 10px; text-align: left;
      font-weight: 600; font-size: 11px; color: #666; border-bottom: 1px solid #e4e4e4;
      text-transform: uppercase; letter-spacing: .03em;
    }
    .data-table td { padding: 7px 8px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
    .data-table tr:last-child td { border-bottom: none; }
    .data-table input {
      width: 100%; padding: 5px 8px; border: 1px solid #e0e0e0; border-radius: 5px;
      font-size: 12px; font-family: inherit; outline: none;
    }
    .data-table input:focus { border-color: #666; }

    /* ── Committee ── */
    .committee-top { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; }
    .committee-top input {
      padding: 8px 12px; border: 1px solid #ddd; border-radius: 8px;
      font-size: 13px; width: 160px; outline: none;
    }
    .committee-top input:focus { border-color: #555; }
    .committee-top button {
      padding: 8px 16px; background: #111; color: #fff;
      border: none; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .committee-top button:hover { background: #333; }

    /* ── Bulletin ── */
    .bulletin-top { display: flex; gap: 10px; align-items: center; margin-bottom: 20px; }
    .bulletin-top select {
      flex: 1; padding: 9px 12px; border: 1px solid #ddd; border-radius: 8px;
      font-size: 13px; outline: none; background: #fff;
    }
    .bulletin-top button {
      padding: 9px 16px; background: #111; color: #fff;
      border: none; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer;
      white-space: nowrap;
    }
    .bulletin-top button:hover { background: #333; }
    details { margin-bottom: 16px; }
    details > summary {
      cursor: pointer; font-size: .9rem; font-weight: 700; padding: 12px 16px;
      background: #fafafa; border: 1px solid #e4e4e4; border-radius: 8px;
      user-select: none; list-style: none;
    }
    details > summary::-webkit-details-marker { display: none; }
    details > summary::before { content: "▶ "; font-size: 10px; color: #888; }
    details[open] > summary { border-radius: 8px 8px 0 0; border-bottom: none; }
    details[open] > summary::before { content: "▼ "; }
    .detail-body {
      border: 1px solid #e4e4e4; border-top: none;
      border-radius: 0 0 8px 8px; padding: 16px;
      background: #fff;
    }

    /* ── News rows ── */
    .news-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    .news-row input {
      flex: 1; padding: 7px 10px; border: 1px solid #ddd; border-radius: 6px;
      font-size: 13px; font-family: inherit; outline: none;
    }
    .news-row input:focus { border-color: #555; }

    /* ── Modal ── */
    .modal-wrap {
      display: none; position: fixed; inset: 0; z-index: 200;
      align-items: center; justify-content: center;
    }
    .modal-wrap.open { display: flex; }
    .modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,.4); }
    .modal-box {
      position: relative; background: #fff; border-radius: 12px;
      padding: 28px; width: 420px; max-width: 90vw; z-index: 1;
    }
    .modal-box h3 { font-size: 1rem; font-weight: 700; margin-bottom: 8px; }
    .modal-box p  { font-size: .85rem; color: #666; margin-bottom: 18px; line-height: 1.6; }
    .modal-box input {
      width: 100%; padding: 9px 12px; border: 1px solid #ddd; border-radius: 8px;
      font-size: 13px; margin-bottom: 14px; outline: none; font-family: inherit;
    }
    .modal-box input:focus { border-color: #555; }
    .modal-btns { display: flex; gap: 8px; }
    .modal-btns button {
      flex: 1; padding: 10px; border-radius: 8px; font-size: 13px;
      font-weight: 600; cursor: pointer; border: none;
    }
    .modal-btns .btn-primary { background: #111; color: #fff; }
    .modal-btns .btn-primary:hover { background: #333; }
    .modal-btns .btn-cancel { background: #f0f0f0; color: #333; }
    .modal-btns .btn-cancel:hover { background: #e0e0e0; }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 24px; right: 24px; padding: 10px 18px;
      border-radius: 8px; font-size: 13px; font-weight: 600;
      background: #111; color: #fff; opacity: 0; pointer-events: none;
      transition: opacity .2s; z-index: 999;
    }
    .toast.show { opacity: 1; }
    .toast.err  { background: #c00; }

    @media (max-width: 600px) {
      .form-grid { grid-template-columns: 1fr; }
      .modal-box { padding: 20px; }
    }
  </style>
</head>
<body>

<!-- ═══════════════ LOGIN ═══════════════ -->
<div id="loginScreen">
  <div class="login-card">
    <h1>희망은교회</h1>
    <p>관리자 페이지</p>
    <form id="loginForm">
      <input id="pwInput" type="password" placeholder="비밀번호" autocomplete="current-password" autofocus>
      <div id="lockMsg" style="display:none;margin-bottom:12px;padding:10px 12px;background:#fff3f3;border:1px solid #f5c6c6;border-radius:8px;font-size:13px;color:#c0392b;line-height:1.6;"></div>
      <button id="loginBtn" type="submit">로그인</button>
    </form>
  </div>
</div>

<!-- ═══════════════ ADMIN APP ═══════════════ -->
<div id="adminApp">
  <header class="admin-header">
    <span class="admin-brand">희망은교회 관리자</span>
    <div class="header-btns">
      <button onclick="openTokenModal()">🔑 GitHub 토큰</button>
      <button onclick="logout()">로그아웃</button>
    </div>
  </header>

  <div class="tab-bar">
    <button class="tab-btn" data-tab="notice"    onclick="switchTab('notice')">공지사항</button>
    <button class="tab-btn" data-tab="committee" onclick="switchTab('committee')">예배위원</button>
    <button class="tab-btn" data-tab="bulletin"  onclick="switchTab('bulletin')">주보</button>
    <button class="tab-btn" data-tab="sermon"    onclick="switchTab('sermon')">설교</button>
  </div>

  <div class="admin-body">

    <!-- ── 공지사항 ── -->
    <div id="tab-notice" class="tab-pane">
      <h2>공지사항</h2>
      <div class="card">
        <div style="font-size:12px;color:#888;margin-bottom:14px;">여러 항목을 추가할 수 있습니다. 위에서 아래 순서로 표시됩니다.</div>
        <div id="noticeItems"></div>
        <button class="btn-add" onclick="addNoticeItem()">+ 항목 추가</button>
        <button class="btn-save" onclick="saveNotice()">저장</button>
      </div>
    </div>

    <!-- ── 예배위원 ── -->
    <div id="tab-committee" class="tab-pane" style="display:none">
      <h2>예배위원</h2>
      <div class="card">
        <div class="committee-top">
          <input id="newWeekId" type="date">
          <button onclick="addCommitteeWeek()">+ 주차 추가</button>
        </div>
        <div style="overflow-x:auto">
          <table class="data-table">
            <thead>
              <tr>
                <th style="width:120px">날짜</th>
                <th>기도</th>
                <th>찬양</th>
                <th>헌금위원</th>
                <th style="width:50px"></th>
              </tr>
            </thead>
            <tbody id="committeeTableBody"></tbody>
          </table>
        </div>
        <button class="btn-save" onclick="saveCommittee()">저장</button>
      </div>
    </div>

    <!-- ── 주보 ── -->
    <div id="tab-bulletin" class="tab-pane" style="display:none">
      <h2>주보</h2>
      <div class="bulletin-top">
        <select id="bulletinWeekSelect" onchange="loadBulletinWeek(this.value)">
          <option value="">— 주차 선택 —</option>
        </select>
        <input id="newBulletinDate" type="date" style="padding:9px 12px;border:1px solid #ddd;border-radius:8px;font-size:13px;outline:none;background:#fff;">
        <button onclick="newBulletinWeek()">새 주차 추가</button>
      </div>

      <div id="bulletinForm" style="display:none">
        <!-- 기본 정보 -->
        <details open>
          <summary>기본 정보</summary>
          <div class="detail-body">
            <div class="form-grid">
              <div class="form-group">
                <label>날짜</label>
                <input id="bWeekId" type="date">
              </div>
              <div class="form-group">
                <label>날짜 표시</label>
                <input id="bDate" type="text" placeholder="2026.03.15">
              </div>
              <div class="form-group">
                <label>호수</label>
                <input id="bIssue" type="text" placeholder="26-11">
              </div>
            </div>
          </div>
        </details>

        <!-- 예배순서 -->
        <details open>
          <summary>예배순서</summary>
          <div class="detail-body">
            <div style="overflow-x:auto">
              <table class="data-table">
                <thead>
                  <tr>
                    <th style="width:130px">순서</th>
                    <th>내용</th>
                    <th style="width:130px">담당</th>
                    <th style="width:36px"></th>
                  </tr>
                </thead>
                <tbody id="orderTableBody"></tbody>
              </table>
            </div>
            <button class="btn-add" onclick="addOrderRow()">+ 행 추가</button>
          </div>
        </details>

        <!-- 성경본문 -->
        <details open>
          <summary>성경본문</summary>
          <div class="detail-body">
            <div class="form-group">
              <label>성경구절</label>
              <input id="bVerseRef" type="text" placeholder="요 3:16">
            </div>
            <div class="form-group">
              <label>본문</label>
              <textarea id="bVerseText" rows="5" placeholder="말씀 본문을 입력하세요"></textarea>
            </div>
          </div>
        </details>

        <!-- 교회소식 -->
        <details open>
          <summary>교회소식</summary>
          <div class="detail-body">
            <div id="newsContainer"></div>
            <button class="btn-add" onclick="addNewsItem()">+ 소식 추가</button>
          </div>
        </details>

        <button class="btn-save" onclick="saveBulletin()">저장</button>
      </div>
    </div>

    <!-- ── 설교 ── -->
    <div id="tab-sermon" class="tab-pane" style="display:none">
      <h2>설교</h2>
      <div class="bulletin-top">
        <select id="sermonFileSelect" onchange="loadSermon(this.value)">
          <option value="">— 설교 선택 —</option>
        </select>
        <button onclick="newSermon()">새 설교 추가</button>
      </div>

      <div id="sermonForm" style="display:none">
        <div class="card">
          <div class="form-grid">
            <div class="form-group">
              <label>날짜</label>
              <input id="sDate" type="date">
            </div>
            <div class="form-group">
              <label>제목</label>
              <input id="sTitle" type="text" placeholder="설교 제목">
            </div>
            <div class="form-group">
              <label>본문</label>
              <input id="sRef" type="text" placeholder="요 3:16">
            </div>
          </div>
          <div class="form-group">
            <label>설교자</label>
            <input id="sPreacher" type="text" placeholder="이일례목사">
          </div>

          <!-- 이미지 -->
          <div class="form-group">
            <label>사진</label>
            <!-- URL 직접 입력 -->
            <div style="display:flex;gap:8px;margin-bottom:8px;">
              <input id="sImageUrl" type="text" placeholder="이미지 URL 직접 입력 (선택)" style="flex:1;" oninput="showSermonImgPreview(this.value.trim())">
              <button type="button" class="btn-icon" onclick="document.getElementById('sImageUrl').value='';showSermonImgPreview('');" title="지우기">✕</button>
            </div>
            <!-- 파일 업로드 -->
            <div style="display:flex;gap:8px;align-items:center;">
              <input id="sImageFile" type="file" accept="image/*" style="flex:1;font-size:12px;">
              <button type="button" class="btn-add" style="margin-top:0;white-space:nowrap;" onclick="uploadSermonImage()">GitHub에 업로드</button>
            </div>
            <!-- 미리보기 -->
            <div id="sImagePreview" style="margin-top:10px;"></div>
          </div>

          <!-- 동영상 -->
          <div class="form-group">
            <label>동영상 URL (YouTube)</label>
            <div style="display:flex;gap:8px;">
              <input id="sVideoUrl" type="text" placeholder="https://www.youtube.com/watch?v=..." style="flex:1;">
              <button type="button" class="btn-icon" onclick="document.getElementById('sVideoUrl').value='';" title="지우기">✕</button>
            </div>
          </div>

          <div class="form-group">
            <label>설교 내용</label>
            <textarea id="sBody" rows="16" placeholder="설교 본문을 입력하세요"></textarea>
          </div>
          <button class="btn-save" onclick="saveSermon()">저장</button>
        </div>
      </div>
    </div>

  </div><!-- /admin-body -->
</div><!-- /adminApp -->

<!-- ═══════════════ GitHub TOKEN MODAL ═══════════════ -->
<div id="tokenModal" class="modal-wrap">
  <div class="modal-overlay" onclick="closeTokenModal()"></div>
  <div class="modal-box">
    <h3>GitHub 토큰 설정</h3>
    <p>
      GitHub → Settings → Developer settings → Personal access tokens에서<br>
      <b>repo</b> 권한의 토큰을 발급하세요.<br>
      토큰은 이 기기의 localStorage에만 저장됩니다.
    </p>
    <input id="tokenInput" type="password" placeholder="ghp_...">
    <div class="modal-btns">
      <button class="btn-primary" onclick="saveToken()">저장</button>
      <button class="btn-cancel"  onclick="closeTokenModal()">취소</button>
    </div>
  </div>
</div>

<!-- ═══════════════ TOAST ═══════════════ -->
<div id="toast" class="toast"></div>

<script>
/* ════════════════════════════════════════════
   상수
════════════════════════════════════════════ */
const PASSWORD  = 'hopeischurch';
const REPO      = 'sungho1103/hopeischurch';
const BRANCH    = 'main';
const API       = `https://api.github.com/repos/${REPO}/contents`;

/* ════════════════════════════════════════════
   유틸
════════════════════════════════════════════ */
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function b64e(str) { return btoa(unescape(encodeURIComponent(str))); }
function b64d(str) { return decodeURIComponent(escape(atob(str.replace(/\n/g,'')))); }
function token()   { return localStorage.getItem('gh_token') || ''; }
function normalizeDate(s) {
  const m = String(s).match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  return m ? `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}` : s;
}

/* ════════════════════════════════════════════
   GitHub API
════════════════════════════════════════════ */
function authHeaders(write = false) {
  const t = token();
  if (write && !t) throw new Error('GitHub 토큰을 먼저 설정하세요 (🔑 버튼)');
  const h = { Accept: 'application/vnd.github.v3+json' };
  if (t) h.Authorization = `token ${t}`;
  return h;
}

async function ghGet(path) {
  const r = await fetch(`${API}/${path}?ref=${BRANCH}&_=${Date.now()}`, {
    headers: authHeaders()
  });
  if (!r.ok) throw new Error(`${r.status} /${path}`);
  const d = await r.json();
  return { text: b64d(d.content), sha: d.sha };
}

async function ghGetSha(path) {
  try { return (await ghGet(path)).sha; }
  catch(e) {
    if (/^404/.test(e.message)) return null; // 파일 없음 → 새로 생성
    throw e; // 401·403 등은 그대로 전파
  }
}

async function ghSave(path, text, sha, msg) {
  const body = { message: msg, content: b64e(text), branch: BRANCH };
  if (sha) body.sha = sha;
  const r = await fetch(`${API}/${path}`, {
    method: 'PUT',
    headers: { ...authHeaders(true), 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!r.ok) {
    const e = await r.json().catch(() => ({}));
    throw new Error(e.message || `${r.status}`);
  }
  return await r.json();
}

/* ════════════════════════════════════════════
   Toast
════════════════════════════════════════════ */
function toast(msg, type = 'ok') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type === 'err' ? ' err' : '');
  clearTimeout(t._tid);
  t._tid = setTimeout(() => { t.className = 'toast'; }, 2800);
}

/* ════════════════════════════════════════════
   인증

function isLoggedIn() { return sessionStorage.getItem('admin') === '1'; }

// ── 브루트포스 잠금 ──────────────────────────
const LOCK_KEY  = 'admin_lock_until';
const FAIL_KEY  = 'admin_fail_count';
let lockTimer   = null;

function getFailCount(){ return parseInt(localStorage.getItem(FAIL_KEY)||'0',10); }
function getLockUntil(){ return parseInt(localStorage.getItem(LOCK_KEY)||'0',10); }

// failCount >= 5 일 때 잠금 시간(ms): 2^(failCount-4) 분
function lockDurationMs(failCount){
  return Math.pow(2, failCount - 4) * 60 * 1000;
}

function formatRemaining(ms){
  const totalSec = Math.ceil(ms / 1000);
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return m > 0 ? `${m}분 ${s}초` : `${s}초`;
}

function startLockCountdown(){
  const lockMsg = document.getElementById('lockMsg');
  const loginBtn = document.getElementById('loginBtn');
  if(lockTimer) clearInterval(lockTimer);

  lockTimer = setInterval(() => {
    const remaining = getLockUntil() - Date.now();
    if(remaining <= 0){
      clearInterval(lockTimer);
      lockTimer = null;
      lockMsg.style.display = 'none';
      loginBtn.disabled = false;
      loginBtn.textContent = '로그인';
      document.getElementById('pwInput').focus();
    } else {
      lockMsg.style.display = 'block';
      lockMsg.innerHTML = `⛔ 로그인이 잠겼습니다.<br><b>${formatRemaining(remaining)}</b> 후 다시 시도하세요.`;
      loginBtn.disabled = true;
      loginBtn.textContent = '잠금 중…';
    }
  }, 500);
}

function login(pw) {
  const lockUntil = getLockUntil();
  if(Date.now() < lockUntil){
    startLockCountdown();
    return;
  }

  if(pw === PASSWORD){
    localStorage.removeItem(FAIL_KEY);
    localStorage.removeItem(LOCK_KEY);
    sessionStorage.setItem('admin', '1');
    showAdmin();
  } else {
    const fails = getFailCount() + 1;
    localStorage.setItem(FAIL_KEY, fails);

    if(fails >= 5){
      const until = Date.now() + lockDurationMs(fails);
      localStorage.setItem(LOCK_KEY, until);
      startLockCountdown();
      toast(`비밀번호 오류 ${fails}회 — 잠금 시작`, 'err');
    } else {
      toast(`비밀번호가 틀렸습니다 (${fails}/5회)`, 'err');
    }
  }
}

function logout() {
  sessionStorage.removeItem('admin');
  location.reload();
}

function showAdmin() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('adminApp').style.display = 'block';
  switchTab('notice');
}

/* ════════════════════════════════════════════
   탭 전환
════════════════════════════════════════════ */
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.tab === tab)
  );
  document.querySelectorAll('.tab-pane').forEach(p =>
    p.style.display = (p.id === `tab-${tab}`) ? '' : 'none'
  );
  if (tab === 'notice')    loadNotice();
  if (tab === 'committee') loadCommittee();
  if (tab === 'bulletin')  loadBulletinIndex();
  if (tab === 'sermon')    loadSermonIndex();
}

function openTokenModal() {
  document.getElementById('tokenInput').value = localStorage.getItem('gh_token') || '';
  document.getElementById('tokenModal').classList.add('open');
}
function closeTokenModal() {
  document.getElementById('tokenModal').classList.remove('open');
}
function saveToken() {
  const v = document.getElementById('tokenInput').value.trim();

let _noticeSha = null;

async function loadNotice() {
  try {
    const res = await fetch('/data/notice.json?_=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    const n = await res.json();
    renderNoticeItems(n.items || []);
  } catch(e) {
    renderNoticeItems([]);
  }
}

function makeNoticeRow(text='', link_url='', link_text='') {
  const div = document.createElement('div');
  div.className = 'notice-row';
  div.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:4px;margin-right:6px;">
      <button class="btn-icon" onclick="noticeMove(this,-1)" title="위로">▲</button>
      <button class="btn-icon" onclick="noticeMove(this,1)"  title="아래로">▼</button>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;gap:6px;">
      <textarea class="ni-text" rows="3" placeholder="공지 내용 (엔터로 줄바꿈)">${esc(text)}</textarea>
      <input class="ni-link-url"  placeholder="링크 URL (선택)" value="${esc(link_url)}">
      <input class="ni-link-text" placeholder="링크 텍스트"     value="${esc(link_text)}">
    </div>
    <button class="btn-icon" style="align-self:flex-start;margin-top:2px;" onclick="this.closest('.notice-row').remove()">✕</button>
  `;
  return div;
}

function noticeMove(btn, dir) {
  const row = btn.closest('.notice-row');
  const container = document.getElementById('noticeItems');
  if (dir === -1 && row.previousElementSibling)
    container.insertBefore(row, row.previousElementSibling);
  else if (dir === 1 && row.nextElementSibling)
    container.insertBefore(row.nextElementSibling, row);
}

function renderNoticeItems(items) {
  const container = document.getElementById('noticeItems');
  container.innerHTML = '';
  items.forEach(item => container.appendChild(makeNoticeRow(item.text, item.link_url, item.link_text)));
}

function addNoticeItem() {
  document.getElementById('noticeItems').appendChild(makeNoticeRow());
}

async function saveNotice() {
  const items = [];
  document.querySelectorAll('#noticeItems .notice-row').forEach(row => {
    const text     = row.querySelector('.ni-text').value.trim();
    const link_url = row.querySelector('.ni-link-url').value.trim();
    const link_text= row.querySelector('.ni-link-text').value.trim();
    if (text) items.push({ text, ...(link_url && { link_url, link_text }) });
  });
  try {
    _noticeSha = await ghGetSha('data/notice.json');
    const res = await ghSave('data/notice.json', JSON.stringify({ items }, null, 2), _noticeSha, 'content: 공지사항 업데이트');
    _noticeSha = res.content.sha;
    toast('공지사항 저장됨 ✓');
  } catch(e) {
    toast('저장 실패: ' + e.message, 'err');
  }
}

let _committeeSha  = null;
let _committeeData = [];

async function loadCommittee() {
  try {
    const res = await fetch('/bulletin/data/committee.json?_=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    _committeeData = await res.json();
    renderCommitteeTable();
  } catch(e) {
    toast('예배위원 로드 실패: ' + e.message, 'err');
  }
}

function renderCommitteeTable() {
  // week_id별 그룹핑
  const byWeek = {};
  _committeeData.forEach(r => {
    if (!byWeek[r.week_id]) byWeek[r.week_id] = { pray: '', praise: '', offering: '' };
    if (r.role === '기도')   byWeek[r.week_id].pray     = r.name;
    if (r.role === '찬양')   byWeek[r.week_id].praise   = r.name;
    if (r.role === '헌금위원') byWeek[r.week_id].offering = r.name;
  });
  const weeks = Object.keys(byWeek).sort();
  document.getElementById('committeeTableBody').innerHTML = weeks.map(w => `
    <tr>
      <td><input class="c-week" readonly value="${esc(w)}" style="width:110px;background:#fafafa;color:#888;"></td>
      <td><input class="c-input" data-week="${esc(w)}" data-role="기도"   value="${esc(byWeek[w].pray)}"></td>
      <td><input class="c-input" data-week="${esc(w)}" data-role="찬양"   value="${esc(byWeek[w].praise)}"></td>
      <td><input class="c-input" data-week="${esc(w)}" data-role="헌금위원" value="${esc(byWeek[w].offering)}"></td>
      <td><button class="btn-del" onclick="deleteCommitteeWeek('${esc(w)}')">삭제</button></td>
    </tr>
  `).join('');
}

function deleteCommitteeWeek(weekId) {
  _committeeData = _committeeData.filter(r => r.week_id !== weekId);
  renderCommitteeTable();
}

function addCommitteeWeek() {
  const w = document.getElementById('newWeekId').value.trim();
  if (!/^\d{4}-\d{2}-\d{2}$/.test(w)) { toast('날짜 형식: YYYY-MM-DD', 'err'); return; }
  if (_committeeData.some(r => r.week_id === w)) { toast('이미 있는 주차입니다', 'err'); return; }
  _committeeData.push({ week_id: w, role: '기도', name: '' });
  _committeeData.push({ week_id: w, role: '찬양', name: '' });
  _committeeData.push({ week_id: w, role: '헌금위원', name: '' });
  _committeeData.sort((a, b) => a.week_id.localeCompare(b.week_id));
  renderCommitteeTable();
  document.getElementById('newWeekId').value = '';
}

async function saveCommittee() {
  // 화면 입력값 수집
  const newData = [];
  document.querySelectorAll('.c-input').forEach(inp => {
    const name = inp.value.trim();
    if (name) newData.push({ week_id: inp.dataset.week, role: inp.dataset.role, name });
  });
  try {
    _committeeSha = await ghGetSha('bulletin/data/committee.json');
    const res = await ghSave('bulletin/data/committee.json', JSON.stringify(newData, null, 2), _committeeSha, 'content: 예배위원 업데이트');
    _committeeSha  = res.content.sha;
    _committeeData = newData;
    toast('예배위원 저장됨 ✓');
  } catch(e) {
    toast('저장 실패: ' + e.message, 'err');
  }
}

let _bulletinIndexSha = null;
let _bulletinIndex    = [];
let _currentBulletinSha = null;

async function loadBulletinIndex() {
  try {
    const res = await fetch('/bulletin/data/index.json?_=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    _bulletinIndex = await res.json();
    const sel = document.getElementById('bulletinWeekSelect');
    sel.innerHTML = '<option value="">— 주차 선택 —</option>' +
      _bulletinIndex.map(w =>
        `<option value="${esc(w.week_id)}">${esc(w.date || w.week_id)} (${esc(w.issue || '')})</option>`
      ).join('');
  } catch(e) {
    toast('주보 목록 로드 실패: ' + e.message, 'err');
  }
}

async function loadBulletinWeek(weekId) {
  if (!weekId) { document.getElementById('bulletinForm').style.display = 'none'; return; }
  try {
    const res = await fetch(`/bulletin/data/${weekId}.json?_=${Date.now()}`, { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    fillBulletinForm(await res.json());
    document.getElementById('bulletinForm').style.display = '';
  } catch(e) {
    toast('주보 로드 실패: ' + e.message, 'err');
  }
}

async function newBulletinWeek() {
  const weekId = document.getElementById('newBulletinDate').value;
  if (!weekId) { toast('날짜를 먼저 선택하세요', 'err'); return; }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(weekId)) { toast('날짜 형식 오류', 'err'); return; }

  _currentBulletinSha = null;

  // 인덱스가 아직 안 불러와졌으면 먼저 로드
  if (_bulletinIndex.length === 0) {
    try { await loadBulletinIndex(); } catch(e) {}
  }

  // 직전 주 데이터를 템플릿으로 로드 (읽기 전용이므로 사이트에서 직접 fetch)
  let prev = { worship_order: [], memory_verse: [], news: [] };
  if (_bulletinIndex.length > 0) {
    const prevWeekId = _bulletinIndex[0].week_id;
    try {
      const res = await fetch(`/bulletin/data/${prevWeekId}.json?_=${Date.now()}`, { cache: 'no-store' });
      if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
      prev = await res.json();
      toast('직전 주(' + prevWeekId + ') 내용을 템플릿으로 불러왔습니다');
    } catch(e) {
      console.error('직전 주 데이터 로드 실패:', e);
      toast('직전 주 데이터 로드 실패: ' + e.message, 'err');
    }
  }

  // 예배위원 데이터에서 해당 날짜 담당자 자동 기입
  const roleToStep = { '기도': '기도', '찬양': '특송', '헌금위원': '헌금' };
  let committeeMap = {};  // step → name
  try {
    const cRes = await fetch('/bulletin/data/committee.json?_=' + Date.now(), { cache: 'no-store' });
    if (cRes.ok) {
      const committeeAll = await cRes.json();
      const matched = (Array.isArray(committeeAll) ? committeeAll : [])
        .filter(c => c.week_id === weekId);
      matched.forEach(c => {
        const step = roleToStep[c.role];
        if (step && c.name) committeeMap[step] = c.name;
      });
    }
  } catch(e) {
    console.warn('예배위원 자동 기입용 데이터 로드 실패:', e);
  }

  // worship_order에 예배위원 담당자 반영
  let worshipOrder = prev.worship_order || [];
  if (Object.keys(committeeMap).length > 0) {
    worshipOrder = worshipOrder.map(item => {
      if (committeeMap[item.step]) {
        return { ...item, person: committeeMap[item.step] };
      }
      return item;
    });
    const filled = Object.keys(committeeMap).join(', ');
    toast('예배위원 자동 기입: ' + filled);
  }

  // 호수 자동 증가 (예: "26-33" → "26-34")
  let nextIssue = '';
  const lastEntry = (_bulletinIndex || []).find(w => w.issue);
  if (lastEntry && lastEntry.issue) {
    const parts = lastEntry.issue.split('-');
    if (parts.length === 2) {
      nextIssue = parts[0] + '-' + String(Number(parts[1]) + 1);
    } else {
      const n = Number(lastEntry.issue);
      nextIssue = isNaN(n) ? '' : String(n + 1);
    }
  }

  fillBulletinForm({
    week: { week_id: weekId, date: weekId.replace(/-/g, '.'), issue: nextIssue, title: '주일예배' },
    worship_order: worshipOrder,
    memory_verse:  prev.memory_verse  || [],
    news:          prev.news          || []
  });
  document.getElementById('bulletinWeekSelect').value = '';
  document.getElementById('bulletinForm').style.display = '';
}

function fillBulletinForm(data) {
  const w = data.week || {};
  document.getElementById('bWeekId').value   = w.week_id || '';
  document.getElementById('bDate').value     = w.date    || (w.week_id ? w.week_id.replace(/-/g, '.') : '');
  document.getElementById('bIssue').value    = w.issue   || '';
  renderOrderRows(data.worship_order || []);
  const mv = (data.memory_verse || [])[0] || {};
  document.getElementById('bVerseRef').value  = mv.reference || '';
  document.getElementById('bVerseText').value = mv.text      || '';
  renderNewsItems(data.news || []);
}

async function saveBulletin() {
  const weekId = document.getElementById('bWeekId').value.trim();
  if (!weekId) { toast('week_id를 입력하세요', 'err'); return; }

  const worship_order = [];
  document.querySelectorAll('#orderTableBody tr').forEach((tr, i) => {
    const step    = tr.querySelector('.o-step').value.trim();
    const content = tr.querySelector('.o-content').value.trim();
    const person  = tr.querySelector('.o-person').value.trim();
    if (step || content || person)
      worship_order.push({ week_id: weekId, order: i + 1, step, content, person });
  });

  const verseRef  = document.getElementById('bVerseRef').value.trim();
  const verseText = document.getElementById('bVerseText').value.trim();
  const memory_verse = (verseRef || verseText)
    ? [{ week_id: weekId, reference: verseRef, text: verseText }] : [];

  const news = [];
  document.querySelectorAll('#newsContainer .n-text').forEach((inp, i) => {
    const t = inp.value.trim();
    if (t) news.push({ week_id: weekId, order: i + 1, text: t });
  });

  const date  = document.getElementById('bDate').value.trim() || weekId.replace(/-/g, '.');
  const issue = document.getElementById('bIssue').value.trim();
  const data  = {
    week: { week_id: weekId, date, issue, title: '주일예배' },
    worship_order, memory_verse, news
  };

  try {
    // 1) 주보 파일 저장
    _currentBulletinSha = await ghGetSha(`bulletin/data/${weekId}.json`);
    const isNew = !_currentBulletinSha;
    const res = await ghSave(
      `bulletin/data/${weekId}.json`,
      JSON.stringify(data, null, 2),
      _currentBulletinSha,
      `content: 주보 ${weekId} ${isNew ? '추가' : '업데이트'}`
    );
    _currentBulletinSha = res.content.sha;

    // 2) index.json 항상 업데이트 (새 주차 추가 + 기존 주차 date/issue 변경 모두 반영)
    const { text: idxText, sha: idxSha } = await ghGet('bulletin/data/index.json');
    const freshIndex = JSON.parse(idxText);
    const existingIdx = freshIndex.findIndex(w => w.week_id === weekId);
    const entry = { week_id: weekId, date, issue, title: '주일예배' };
    if (existingIdx >= 0) {
      freshIndex[existingIdx] = entry;   // 기존 항목 갱신
    } else {
      freshIndex.push(entry);            // 새 항목 추가
    }
    freshIndex.sort((a, b) => b.week_id.localeCompare(a.week_id));

    const idxRes = await ghSave(
      'bulletin/data/index.json',
      JSON.stringify(freshIndex, null, 2),
      idxSha,
      `content: 주보 목록 업데이트 (${weekId})`
    );
    _bulletinIndexSha = idxRes.content.sha;
    _bulletinIndex = freshIndex;
    await loadBulletinIndex();
    document.getElementById('bulletinWeekSelect').value = weekId;

    toast(`주보 ${weekId} 저장됨 ✓`);
  } catch(e) {
    toast('저장 실패: ' + e.message, 'err');
  }
}


async function loadSermonIndex() {
  try {
    const res = await fetch('/sermon/texts/index.json?_=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    _sermonFiles = (data.files || [])
      .filter(f => /\.txt$/i.test(f))
      .sort((a, b) => b.localeCompare(a));
    const sel = document.getElementById('sermonFileSelect');
    sel.innerHTML = '<option value="">— 설교 선택 —</option>' +
      _sermonFiles.map(f =>
        `<option value="${esc(f)}">${esc(f.replace(/\.txt$/i, ''))}</option>`
      ).join('');
    if (_sermonFiles.length > 0) {
      sel.value = _sermonFiles[0];
      loadSermon(_sermonFiles[0]);
    }
  } catch(e) {
    toast('설교 목록 로드 실패: ' + e.message, 'err');
  }
}

async function loadSermon(filename) {
  if (!filename) { document.getElementById('sermonForm').style.display = 'none'; return; }
  try {
    const res = await fetch(`/sermon/texts/${filename}?_=${Date.now()}`, { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    _currentSermonFile = filename;
    fillSermonForm(filename, await res.text());
    document.getElementById('sermonForm').style.display = '';
  } catch(e) {
    toast('설교 로드 실패: ' + e.message, 'err');
  }
}

function fillSermonForm(filename, txt) {
  const lines = txt.replace(/\r\n/g, '\n').split('\n');
  const meta = {};
  let i = 0;
  for (; i < lines.length; i++) {
    const line = lines[i].trim();
    if (line === '') { i++; break; }
    const m = line.match(/^([^:]+)\s*:\s*(.*)$/);
    if (m) meta[m[1].trim()] = m[2].trim();
  }
  const body = lines.slice(i).join('\n').trim();
  const rawDate = meta['날짜'] || meta['date'] || filename.replace(/\.txt$/i, '');
  document.getElementById('sDate').value     = normalizeDate(rawDate);
  document.getElementById('sTitle').value    = meta['제목'] || meta['title'] || '';
  document.getElementById('sRef').value      = meta['본문'] || meta['text'] || '';
  document.getElementById('sPreacher').value = meta['설교자'] || meta['preacher'] || '';
  document.getElementById('sBody').value     = body;
  const imgUrl = meta['이미지'] || meta['image'] || '';
  document.getElementById('sImageUrl').value = imgUrl;
  showSermonImgPreview(imgUrl);
  document.getElementById('sVideoUrl').value = meta['동영상'] || meta['video'] || '';
}

function newSermon() {
  _currentSermonFile = null;
  _currentSermonSha  = null;
  document.getElementById('sermonFileSelect').value = '';
  document.getElementById('sDate').value     = '';
  document.getElementById('sTitle').value    = '';
  document.getElementById('sRef').value      = '';
  document.getElementById('sPreacher').value = '';
  document.getElementById('sBody').value     = '';
  document.getElementById('sImageUrl').value = '';
  document.getElementById('sImageFile').value = '';
  showSermonImgPreview('');
  document.getElementById('sermonForm').style.display = '';
  document.getElementById('sDate').focus();
}

async function saveSermon() {
  const date     = document.getElementById('sDate').value.trim();
  const title    = document.getElementById('sTitle').value.trim();
  const ref      = document.getElementById('sRef').value.trim();
  const preacher = document.getElementById('sPreacher').value.trim();
  const body     = document.getElementById('sBody').value.trim();
  if (!date) { toast('날짜를 입력하세요', 'err'); return; }

  const imageUrl = document.getElementById('sImageUrl').value.trim();
  const videoUrl = document.getElementById('sVideoUrl').value.trim();
  const filename = date.replace(/\./g, '-').replace(/[^\d-]/g, '') + '.txt';
  const content = `제목: ${title}\n본문: ${ref}\n설교자: ${preacher}\n날짜: ${date}${imageUrl ? '\n이미지: '+imageUrl : ''}${videoUrl ? '\n동영상: '+videoUrl : ''}\n\n${body}`;

  try {
    const filePath = `sermon/texts/${filename}`;
    _currentSermonSha = await ghGetSha(filePath);
    const isNew = !_currentSermonSha;
    const res = await ghSave(filePath, content, _currentSermonSha, `content: 설교 ${date} ${isNew ? '추가' : '업데이트'}`);
    _currentSermonSha  = res.content.sha;
    _currentSermonFile = filename;

    // 새 파일이면 index.json 업데이트
    if (isNew) {
      _sermonIndexSha = await ghGetSha('sermon/texts/index.json');
      if (!_sermonFiles.includes(filename)) {
        _sermonFiles = [filename, ..._sermonFiles].sort((a, b) => b.localeCompare(a));
      }
      const idxRes = await ghSave('sermon/texts/index.json', JSON.stringify({ files: _sermonFiles }, null, 2), _sermonIndexSha, `content: 설교 목록 업데이트 (${filename})`);
      _sermonIndexSha = idxRes.content.sha;
      await loadSermonIndex();
      document.getElementById('sermonFileSelect').value = filename;
    }
    toast(`설교 ${date} 저장됨 ✓`);
  } catch(e) {
    toast('저장 실패: ' + e.message, 'err');
  }
}

/* ════════════════════════════════════════════
   설교 이미지
════════════════════════════════════════════ */
function showSermonImgPreview(src) {
  const box = document.getElementById('sImagePreview');
  if (src) {
    box.innerHTML = `<img src="${esc(src)}" alt="미리보기" style="max-width:100%;max-height:200px;border-radius:8px;border:1px solid #e4e4e4;">`;
  } else {
    box.innerHTML = '';
  }
}

async function uploadSermonImage() {
  const fileInput = document.getElementById('sImageFile');
  const file = fileInput.files[0];
  if (!file) { toast('파일을 선택하세요', 'err'); return; }
  const date = document.getElementById('sDate').value;
  if (!date) { toast('날짜를 먼저 선택하세요', 'err'); return; }

  const ext = file.name.split('.').pop().toLowerCase();
  const imgFilename = `${date}.${ext}`;
  const imgPath = `sermon/images/${imgFilename}`;

  toast('업로드 중…');
  const reader = new FileReader();
  reader.onload = async function(e) {
    const base64 = e.target.result.split(',')[1];
    try {
      const sha = await ghGetSha(imgPath);
      const body = { message: `content: 설교 이미지 ${imgFilename}`, content: base64, branch: BRANCH };
      if (sha) body.sha = sha;
      const r = await fetch(`${API}/${imgPath}`, {
        method: 'PUT',
        headers: { ...authHeaders(true), 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (!r.ok) { const err = await r.json().catch(()=>({})); throw new Error(err.message || r.status); }
      const publicUrl = `/sermon/images/${imgFilename}`;
      document.getElementById('sImageUrl').value = publicUrl;
      showSermonImgPreview(publicUrl);
      fileInput.value = '';
      toast('이미지 업로드됨 ✓');
    } catch(e) {
      toast('업로드 실패: ' + e.message, 'err');
    }
  };
  reader.readAsDataURL(file);
}
