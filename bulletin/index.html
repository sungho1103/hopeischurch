<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>주보 | 희망은교회</title>

  <!-- 공통 CSS -->
  <link rel="stylesheet" href="/hopeischurch/assets/common.css?v=20260203-01">

  <!-- 주보 페이지 전용(스코프) CSS -->
  <style>
    /* ===============================
       Bulletin Page (Scoped)
    =============================== */
    body.page-bulletin main{ background:#f3f5f9; padding:0; }
    body.page-bulletin .wrap{ padding-top:10px; }
    .page-bulletin .container{
      max-width: 1100px;
      margin: 0 auto;
      padding: 30px 16px 40px;
    }
    .page-bulletin .topbar{
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:16px;
    }
    .page-bulletin .muted{ color:#666; font-size:0.8rem; line-height:1.7; }
    .page-bulletin main h1{ margin:0; font-size:1.75rem; letter-spacing:-.02em; }
    .page-bulletin .controls{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    .page-bulletin #weekSelect{
      padding:10px 12px;
      border:2px solid #999;
      border-radius:12px;
      background:#fff;
      font-size:0.8rem;
      min-width: 220px;
    }
    .page-bulletin button{
      padding:10px 12px;
      border:1px solid #e6e6e6;
      border-radius:12px;
      background:#fff;
      font-size:0.8rem;
      cursor:pointer;
    }
    .page-bulletin button:hover{ background:#f3f5f9; }
    .page-bulletin .meta{ text-align:right; }
    .page-bulletin .badge{
      display:inline-block;
      padding:4px 10px;
      border:1px solid #e6e6e6;
      border-radius:999px;
      color:#555;
      font-size:0.7rem;
      background:#fff;
    }
    .page-bulletin hr{ margin: 18px 0; border:none; border-top:1px solid #e6e9ef; }
    .page-bulletin .b-card{
      background:#fff;
      border-radius:16px;
      padding:16px 16px;
      box-shadow:0 6px 14px rgba(0,0,0,.06);
      overflow-x:auto;
    }
    .page-bulletin .b-card h2{ margin:0 0 12px; font-size:1.05rem; font-weight:700; color:#222; }
    .page-bulletin .b3-grid{
      display:grid;
      grid-template-columns: 1fr minmax(320px,1.1fr) 1fr;
      gap:16px;
      align-items:start;
    }
    .page-bulletin .b-mid{
      display:grid;
      grid-template-rows:auto auto;
      gap:16px;
    }
    .page-bulletin .order-table{ width:100%; border-collapse:collapse; font-size:0.8rem; }
    .page-bulletin .order-table th,
    .page-bulletin .order-table td{
      padding:10px 8px;
      border-bottom:1px solid #eceff3;
      text-align:left;
      vertical-align:top;
    }
    .page-bulletin .order-table th{
      color:#555;
      font-weight:600;
      font-size:0.7rem;
      background:#fafafa;
      border-bottom:1px solid #eceff3;
    }
    .page-bulletin .order-table tr:last-child td{ border-bottom:none; }
    .page-bulletin .verse{ margin:0; font-size:0.85rem; line-height:1.75; color:#222; }
    .page-bulletin .news{ list-style:none; margin:0; padding:0; }
    .page-bulletin .news li{
      display:flex;
      gap:10px;
      align-items:flex-start;
      padding:10px 0;
      border-bottom:1px solid #eceff3;
      font-size:0.8rem;
    }
    .page-bulletin .news li:last-child{ border-bottom:none; }
    .page-bulletin .tag{
      display:inline-block;
      padding:3px 10px;
      border:1px solid #e6e6e6;
      border-radius:999px;
      font-size:0.7rem;
      color:#555;
      background:#fff;
      flex-shrink:0;
    }
    .page-bulletin .txt{ color:#333; line-height:1.6; }
    .page-bulletin .roster-table{ width:100%; min-width:280px; border-collapse:collapse; font-size:0.8rem; }
    .page-bulletin .roster-table th,
    .page-bulletin .roster-table td{
      border:1px solid #e6e6e6;
      padding:10px 6px;
      text-align:center;
      vertical-align:middle;
      white-space:nowrap;
      min-width:44px;
    }
    .page-bulletin .roster-table th{ font-weight:700; background:#fafafa; }
    @media (max-width: 980px){
      .page-bulletin .b3-grid{ grid-template-columns: 1fr; }
      .page-bulletin .meta{ text-align:left; }
      .page-bulletin #weekSelect{ min-width: 180px; }
    }
    @media (max-width: 768px){
      body.page-bulletin .wrap{ padding-top:0; }
      .page-bulletin .container{ padding:10px 16px 40px; }
      .page-bulletin .topbar{ flex-direction:column; align-items:flex-start; gap:8px; }
      .page-bulletin .controls label{ display:none; }
      .page-bulletin #weekSelect{ width:100%; min-width:0; }
      .page-bulletin .controls{ width:100%; flex-wrap:wrap; gap:6px; }
      .page-bulletin .meta{ width:100%; display:flex; gap:8px; align-items:center; }
    }
  </style>
</head>
<body class="page-bulletin">
  <!-- 모바일 Sticky Header -->
  <header class="mobile-header">
    <span class="mobile-brand">희망은교회</span>
    <button class="hamburger" id="hamburgerBtn" aria-label="메뉴 열기">
      <span></span><span></span><span></span>
    </button>
  </header>
  <div class="drawer-overlay" id="drawerOverlay"></div>
  <nav class="drawer" id="drawer">
    <button class="drawer-close" id="drawerClose" aria-label="메뉴 닫기">×</button>
    <a href="/hopeischurch/" data-nav="home">홈</a>
    <a href="/hopeischurch/bulletin/" data-nav="bulletin">주보</a>
    <a href="/hopeischurch/sermon/" data-nav="sermon">주일설교</a>
    <a href="/hopeischurch/#map" data-nav="map">찾아오는 길</a>
  </nav>
  <div class="mobile-notice" id="mobileNotice"></div>

<div class="wrap">
  <aside>
    <div class="brand">희망은교회</div>
    <nav id="menu">
      <a href="/hopeischurch/" data-nav="home">홈</a>
      <a href="/hopeischurch/bulletin/" data-nav="bulletin">주보</a>
      <a href="/hopeischurch/sermon/" data-nav="sermon">주일설교</a>
      <a href="/hopeischurch/#map" data-nav="map">찾아오는 길</a>
    </nav>
    <div class="notice" id="siteNotice"></div>
  </aside>
  <main>
    <div class="container">
      <div class="topbar">
        <div>
          <h1>주보</h1>
          <div class="controls" style="margin-top:10px;">
            <label class="muted" for="weekSelect">주차 선택</label>
            <select id="weekSelect"></select>
            <button id="prevBtn" type="button">이전 주</button>
            <button id="nextBtn" type="button">다음 주</button>
          </div>
        </div>
        <div class="meta">
          <div><span class="badge" id="issueText">—</span></div>
          <div class="muted" id="dateText" style="margin-top:8px;">—</div>
        </div>
      </div>
      <hr/>
      <div id="bulletinBody">
        <div class="b3-grid">
          <section class="b-card"><h2>예배순서</h2><div class="muted">불러오는 중…</div></section>
          <section class="b-mid">
            <section class="b-card"><h2>성경본문</h2><div class="muted">불러오는 중…</div></section>
            <section class="b-card"><h2>예배위원</h2><div class="muted">불러오는 중…</div></section>
          </section>
          <section class="b-card"><h2>교회소식</h2><div class="muted">불러오는 중…</div></section>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- 모바일 하단 탭바 -->
<nav class="bottom-nav">
  <a href="/hopeischurch/" class="bottom-nav-item" data-nav="home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/><path d="M9 21V12h6v9"/>
    </svg>
    <span>홈</span>
  </a>
  <a href="/hopeischurch/bulletin/" class="bottom-nav-item" data-nav="bulletin">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h8M8 15h5"/>
    </svg>
    <span>주보</span>
  </a>
  <a href="/hopeischurch/sermon/" class="bottom-nav-item" data-nav="sermon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/>
    </svg>
    <span>설교</span>
  </a>
  <a href="/hopeischurch/#map" class="bottom-nav-item" data-nav="map">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/>
    </svg>
    <span>위치</span>
  </a>
</nav>

<script>
  // 공지사항 동적 로드
  fetch('/hopeischurch/data/notice.json',{cache:'no-store'})
    .then(r=>r.json()).then(n=>{
      const el=document.getElementById('siteNotice');
      if(el){ const items=n.items||[]; if(items.length){ el.innerHTML=items.map(item=>{ let line=escapeHtml(item.text||'').replace(/\n/g,'<br>'); if(item.link_url) line+=` <a href="${escapeHtml(item.link_url)}" target="_blank" rel="noreferrer">${escapeHtml(item.link_text||item.link_url)}</a>`; return `<div class="notice-item">${line}</div>`; }).join(''); } }
      const mob=document.getElementById('mobileNotice'); if(!mob) return;
      const items=n.items||[]; if(!items.length) return;
      mob.innerHTML=items.map(item=>`<div class="mobile-notice-item">${escapeHtml(item.text||'').replace(/\n/g,'<br>')}</div>`).join('');
      mob.classList.add('has-items');
    }).catch(()=>{});

  // 모바일 햄버거 메뉴
  (function(){
    const btn=document.getElementById('hamburgerBtn'),overlay=document.getElementById('drawerOverlay'),drawer=document.getElementById('drawer'),closeBtn=document.getElementById('drawerClose');
    if(!btn) return;
    function open(){ drawer.classList.add('open'); overlay.classList.add('open'); document.body.style.overflow='hidden'; }
    function close(){ drawer.classList.remove('open'); overlay.classList.remove('open'); document.body.style.overflow=''; }
    btn.addEventListener('click',open); closeBtn.addEventListener('click',close); overlay.addEventListener('click',close);
  })();

  // 하단 탭바 + 드로어 active 상태
  (function(){
    const path=location.pathname;
    document.querySelectorAll('.bottom-nav-item[data-nav], .drawer a[data-nav], #menu a[data-nav]').forEach(el=>{
      const nav=el.dataset.nav;
      if((nav==='home'&&(path==='/hopeischurch/'||path.endsWith('/index.html')&&!path.includes('/bulletin/')&&!path.includes('/sermon/')))||(nav==='bulletin'&&path.includes('/bulletin/'))||(nav==='sermon'&&path.includes('/sermon/')))
        el.classList.add('is-active');
    });
  })();


  const DATA_BASE = "/hopeischurch/bulletin/data";
  const qs = new URLSearchParams(location.search);
  const weekParam = qs.get("week");
  const weekSelect = document.getElementById("weekSelect");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  function setWeekInUrl(weekId){
    const u = new URL(location.href);
    u.searchParams.set("week", weekId);
    location.href = u.toString();
  }
  function escapeHtml(s){
    return String(s ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
  }
  function formatWeekLabel(w){
    const date = w.date || w.week_id || "";
    const issue = w.issue ? "("+w.issue+"호)" : "";
    const title = w.title ? " "+w.title : "";
    return (date+" "+issue+title).trim();
  }
  async function fetchJSON(url){
    const res = await fetch(url, { cache:"no-store" });
    if(!res.ok) throw new Error("fetch failed: "+res.status);
    return await res.json();
  }
  async function loadWeeks(){
    const weeks = await fetchJSON(DATA_BASE+"/index.json");
    if(!weeks.length){
      weekSelect.innerHTML = "<option value=''>주차 데이터가 없습니다</option>";
      return { weeks: [], selected: "" };
    }
    // issue가 비어있는 항목은 날짜순 정렬 후 마지막 번호에서 자동 증가
    const byDate = [...weeks].sort((a,b) => String(a.week_id).localeCompare(String(b.week_id)));
    let lastIssue = null;
    for(const w of byDate){
      if(w.issue){ lastIssue = w.issue; }
      else if(lastIssue){
        const m = lastIssue.match(/^(\d+)-(\d+)$/);
        if(m){ lastIssue = m[1]+"-"+String(Number(m[2])+1).padStart(2,"0"); w.issue = lastIssue; }
      }
    }
    weekSelect.innerHTML = weeks.map(w => "<option value='"+escapeHtml(w.week_id)+"'>"+escapeHtml(formatWeekLabel(w))+"</option>").join("");
    const selected = (weekParam && weeks.some(w => w.week_id === weekParam)) ? weekParam : weeks[0].week_id;
    weekSelect.value = selected;
    weekSelect.addEventListener("change", () => { setWeekInUrl(weekSelect.value); });
    return { weeks, selected };
  }
  function hookPrevNext(weeks, selected){
    const idx = weeks.findIndex(w => w.week_id === selected);
    prevBtn.onclick = () => { if(idx < 0 || idx >= weeks.length - 1) return; setWeekInUrl(weeks[idx + 1].week_id); };
    nextBtn.onclick = () => { if(idx <= 0) return; setWeekInUrl(weeks[idx - 1].week_id); };
  }
  function renderBulletin(data, monthCommittees){
    const week = data.week || {};
    document.getElementById("issueText").textContent = week.issue ? "주보 "+week.issue+"호" : "주보";
    document.getElementById("dateText").textContent = week.date || week.week_id || "";
    const news = (data.news || []).map(r => r.text).filter(Boolean);
    const order = (data.worship_order || []);
    const memory = (data.memory_verse || [])[0] || null;

    // 예배위원: 월간 전체 주차 표시 (날짜 오름차순)
    const rows = (monthCommittees || []).sort((a,b) => String(a.week_id).localeCompare(String(b.week_id)));
    const committeeHtml = rows.length
      ? "<table class='roster-table'><thead><tr><th>날짜</th><th>기도</th><th>찬양</th><th>헌금위원</th></tr></thead><tbody>"
        + rows.map(r => "<tr"+(r.week_id === week.week_id ? " style='background:#fffbe6;font-weight:600;'" : "")+">"
            +"<td>"+escapeHtml(r.week_id||"")+"</td>"
            +"<td>"+escapeHtml(r.pray||"")+"</td>"
            +"<td>"+escapeHtml(r.praise||"")+"</td>"
            +"<td>"+escapeHtml(r.offering||"")+"</td>"
          +"</tr>").join("")
        +"</tbody></table>"
      : "<div class='muted'>예배위원 정보가 없습니다.</div>";

    const orderHtml = order.length
      ? "<table class='order-table'><thead><tr><th style='width:70px;'>순서</th><th>내용</th><th style='width:90px;'>담당</th></tr></thead><tbody>"+order.map(r => "<tr><td>"+escapeHtml(r.step||"")+"</td><td>"+escapeHtml(r.content||"")+"</td><td>"+escapeHtml(r.person||"")+"</td></tr>").join("")+"</tbody></table>"
      : "<div class='muted'>예배순서가 없습니다.</div>";
    const verseHtml = (memory && (memory.reference || memory.text))
      ? "<p class='verse'><b>"+escapeHtml(memory.reference||"")+"</b><br/>"+escapeHtml(memory.text||"")+"</p>"
      : "<div class='muted'>등록된 외울 말씀이 없습니다.</div>";
    const newsHtml = news.length
      ? "<ul class='news'>"+news.map(t => "<li><span class='tag'>소식</span><div class='txt'>"+escapeHtml(t)+"</div></li>").join("")+"</ul>"
      : "<div class='muted'>등록된 소식이 없습니다.</div>";
    document.getElementById("bulletinBody").innerHTML = "<div class='b3-grid'><section class='b-card'><h2>예배순서</h2>"+orderHtml+"</section><section class='b-mid'><section class='b-card'><h2>성경본문</h2>"+verseHtml+"</section><section class='b-card'><h2>예배위원</h2>"+committeeHtml+"</section></section><section class='b-card'><h2>교회소식</h2>"+newsHtml+"</section></div>";
  }
  async function main(){
    const { weeks, selected } = await loadWeeks();
    if(!weeks.length) return;
    hookPrevNext(weeks, selected);

    // 현재 주차 데이터 + committee.json 병렬 로드
    const [data, allCommittee] = await Promise.all([
      fetchJSON(DATA_BASE+"/"+encodeURIComponent(selected)+".json"),
      fetchJSON(DATA_BASE+"/committee.json").catch(()=>[])
    ]);

    // committee.json에서 해당 월(YYYY-MM)의 데이터만 필터링
    const selMonth = selected.slice(0,7);
    const monthRaws = allCommittee.filter(r => r.week_id && r.week_id.slice(0,7) === selMonth);

    // week_id별로 그룹핑 → 한 행으로
    const byWeek = {};
    monthRaws.forEach(r => {
      if(!byWeek[r.week_id]) byWeek[r.week_id] = { week_id: r.week_id, pray:"", praise:"", offering:"" };
      if(r.role === "기도") byWeek[r.week_id].pray = r.name||"";
      if(r.role === "찬양") byWeek[r.week_id].praise = r.name||"";
      if(r.role === "헌금위원") byWeek[r.week_id].offering = r.name||"";
    });
    const monthCommittees = Object.values(byWeek).sort((a,b) => a.week_id.localeCompare(b.week_id));

    renderBulletin(data, monthCommittees);
  }
  main().catch(err => {
    console.error(err);
    document.getElementById("bulletinBody").innerHTML = "<div class='b3-grid'><section class='b-card'><h2>주보 불러오기 실패</h2><div class='muted' style='margin-top:10px;'>오류: "+escapeHtml(err&&err.message||String(err))+"</div></section></div>";
  });
</script>
</body>
</html>
