<script>

  // íë¨ í­ë° + ëë¡ì´ active ìí
  (function(){

  const DATA_BASE = "/bulletin/data";
  const qs = new URLSearchParams(location.search);
  const weekParam = qs.get("week");

  function setWeekInUrl(weekId){
    const u = new URL(location.href);
    u.searchParams.set("week", weekId);
    location.href = u.toString();
  }
  function escapeHtml(s){
    return String(s ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
  }
  function formatWeekLabel(w){
    const date = w.date || w.week_id || "";
    const issue = w.issue ? "("+w.issue+"í¸)" : "";
    const title = w.title ? " "+w.title : "";
    return (date+" "+issue+title).trim();
  }
  async function fetchJSON(url){
    const res = await fetch(url, { cache:"no-store" });
    if(!res.ok) throw new Error("fetch failed: "+res.status);
    return await res.json();
  }
  async function loadWeeks(){
    // GitHub Contents APIë¡ bulletin/data/ í´ë íì¼ ëª©ë¡ ê°ì ¸ì¤ê¸°
    const dirRes = await fetch(
      "https://api.github.com/repos/sungho1103/hopeischurch/contents/bulletin/data?ref=main&_=" + Date.now(),
      { headers: { Accept: "application/vnd.github.v3+json" } }
    );
    if (!dirRes.ok) throw new Error("í´ë ëª©ë¡ ë¡ë ì¤í¨: " + dirRes.status);
    const dirItems = await dirRes.json();

    // YYYY-MM-DD.json íì¼ë§ ì¶ì¶, ë ì§ ì­ì ì ë ¬
    const dateFiles = dirItems
      .filter(f => f.type === "file" && /^\d{4}-\d{2}-\d{2}\.json$/.test(f.name))
      .sort((a, b) => b.name.localeCompare(a.name));

    if (!dateFiles.length) {
      weekSelect.innerHTML = "<option value=''>ì£¼ì°¨ ë°ì´í°ê° ììµëë¤</option>";
      return { weeks: [], selected: "" };
    }

    // ê° íì¼ì week íë ë³ë ¬ ë¡ë
    const weekDataArr = await Promise.all(
      dateFiles.map(f =>
        fetch(f.download_url + "?_=" + Date.now(), { cache: "no-store" })
          .then(r => r.json())
          .then(d => d.week || { week_id: f.name.replace(".json",""), date: f.name.replace(".json","").replace(/-/g,"."), issue: "", title: "ì£¼ì¼ìë°°" })
          .catch(() => ({ week_id: f.name.replace(".json",""), date: f.name.replace(".json","").replace(/-/g,"."), issue: "", title: "ì£¼ì¼ìë°°" }))
      )
    );

    const weeks = weekDataArr;
    weekSelect.innerHTML = weeks.map(w =>
      "<option value='" + escapeHtml(w.week_id) + "'>" + escapeHtml(formatWeekLabel(w)) + "</option>"
    ).join("");

    const selected = (weekParam && weeks.some(w => w.week_id === weekParam))
      ? weekParam : weeks[0].week_id;
    weekSelect.value = selected;
    weekSelect.addEventListener("change", () => { setWeekInUrl(weekSelect.value); });
    return { weeks, selected };
  }

  function hookPrevNext(weeks, selected){
    const idx = weeks.findIndex(w => w.week_id === selected);
    prevBtn.onclick = () => { if(idx < 0 || idx >= weeks.length - 1) return; setWeekInUrl(weeks[idx + 1].week_id); };
    nextBtn.onclick = () => { if(idx <= 0) return; setWeekInUrl(weeks[idx - 1].week_id); };
  }
  function renderBulletin(data, monthCommittees){
    const week = data.week || {};
    document.getElementById("issueText").textContent = week.issue ? "ì£¼ë³´ "+week.issue+"í¸" : "ì£¼ë³´";
    document.getElementById("dateText").textContent = week.date || week.week_id || "";
    const news = (data.news || []).map(r => r.text).filter(Boolean);
    const order = (data.worship_order || []);
    const memory = (data.memory_verse || [])[0] || null;

    // ìë°°ìì: ìê° ì ì²´ ì£¼ì°¨ íì (ë ì§ ì¤ë¦ì°¨ì)
    const today = new Date().toISOString().slice(0,10);
  const rows = (monthCommittees || []).sort((a,b) => String(a.week_id).localeCompare(String(b.week_id)));
  const upcomingWeekId = rows.filter(r => r.week_id >= today).map(r => r.week_id)[0] || rows[rows.length-1]?.week_id;
    const committeeHtml = rows.length
      ? "<table class='roster-table'><thead><tr><th>ë ì§</th><th>ê¸°ë</th><th>ì°¬ì</th><th>íê¸ìì</th></tr></thead><tbody>"
        + rows.map(r => "<tr"+(r.week_id === upcomingWeekId ? " style='background:#fffbe6;font-weight:600;'" : "")+">"
            +"<td>"+escapeHtml(r.week_id||"")+"</td>"
            +"<td>"+escapeHtml(r.pray||"")+"</td>"
            +"<td>"+escapeHtml(r.praise||"")+"</td>"
            +"<td>"+escapeHtml(r.offering||"")+"</td>"
          +"</tr>").join("")
        +"</tbody></table>"
      : "<div class='muted'>ìë°°ìì ì ë³´ê° ììµëë¤.</div>";

    const orderHtml = order.length
      ? "<table class='order-table'><thead><tr><th style='width:90px;'>ìì</th><th>ë´ì©</th><th style='width:90px;'>ë´ë¹</th></tr></thead><tbody>"+order.map(r => "<tr><td>"+escapeHtml(r.step||"")+"</td><td>"+escapeHtml(r.content||"")+"</td><td>"+escapeHtml(r.person||"")+"</td></tr>").join("")+"</tbody></table>"
      : "<div class='muted'>ìë°°ììê° ììµëë¤.</div>";
    const verseHtml = (memory && (memory.reference || memory.text))
      ? "<p class='verse'><b>"+escapeHtml(memory.reference||"")+"</b><br/>"+escapeHtml(memory.text||"")+"</p>"
      : "<div class='muted'>ë±ë¡ë ì¸ì¸ ë§ìì´ ììµëë¤.</div>";
    const newsHtml = news.length
      ? "<ul class='news'>"+news.map(t => "<li><span class='tag'>ìì</span><div class='txt'>"+escapeHtml(t)+"</div></li>").join("")+"</ul>"
      : "<div class='muted'>ë±ë¡ë ììì´ ììµëë¤.</div>";
    document.getElementById("bulletinBody").innerHTML = "<div class='b3-grid'><section class='b-card'><h2>ìë°°ìì</h2>"+orderHtml+"</section><section class='b-mid'><section class='b-card'><h2>ì±ê²½ë³¸ë¬¸</h2>"+verseHtml+"</section><section class='b-card'><h2>ìë°°ìì</h2>"+committeeHtml+"</section></section><section class='b-card'><h2>êµíìì</h2>"+newsHtml+"</section></div>";
  }
  async function main(){
    const { weeks, selected } = await loadWeeks();
    if(!weeks.length) return;
    hookPrevNext(weeks, selected);

    // íì¬ ì£¼ì°¨ ë°ì´í° + committee.json ë³ë ¬ ë¡ë
    const [data, allCommittee] = await Promise.all([
      fetchJSON(DATA_BASE+"/"+encodeURIComponent(selected)+".json"),
      fetchJSON(DATA_BASE+"/committee.json").catch(()=>[])
    ]);

    // committee.jsonìì í´ë¹ ì(YYYY-MM)ì ë°ì´í°ë§ íí°ë§
    const selMonth = selected.slice(0,7);
    const monthRaws = allCommittee.filter(r => r.week_id && r.week_id.slice(0,7) === selMonth);

    // week_idë³ë¡ ê·¸ë£¹í â í íì¼ë¡
    const byWeek = {};
    monthRaws.forEach(r => {
      if(!byWeek[r.week_id]) byWeek[r.week_id] = { week_id: r.week_id, pray:"", praise:"", offering:"" };
      if(r.role === "ê¸°ë") byWeek[r.week_id].pray = r.name||"";

    });
    const monthCommittees = Object.values(byWeek).sort((a,b) => a.week_id.localeCompare(b.week_id));

    renderBulletin(data, monthCommittees);
  }
  main().catch(err => {

  });
</script>
