<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>주보 | 희망은교회</title>

  <!-- 공통 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/assets/common.css?v=20260822-3">

  <!-- 주보 페이지 전용(스코프) CSS -->
  <style>
    /* ===============================
       Bulletin Page (Scoped)
    =============================== */
    body.page-bulletin main{ background:var(--c-bg-subtle); padding:0; margin:0 20px; }
    body.page-bulletin .wrap{ padding-top:0; }
    .page-bulletin .container{
      padding: 44px 16px 40px;
    }
    .page-bulletin .topbar{
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:16px;
    }
    .page-bulletin .muted{ color:var(--c-text-sub); font-size:0.9rem; line-height:1.7; }
    .page-bulletin main h1{ margin:0; font-size:var(--fs-h1,2.4rem); font-weight:800; letter-spacing:-.03em; }
    .page-bulletin .controls{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    .page-bulletin #weekSelect{
      display:flex; align-items:center; gap:10px; text-align:left;
      padding:10px 12px;
      border:1.5px solid var(--c-accent);
      border-radius:var(--radius-sm);
      background:var(--c-accent);
      color:#fff;
      font:inherit; font-size:0.9rem;
      min-width:220px; max-width:100%;
    }
    .page-bulletin #weekSelect:hover{ background:var(--c-accent-hover); }
    .page-bulletin #weekSelect .sp-cur{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .page-bulletin #weekSelect .sp-arrow{ flex-shrink:0; font-size:0.75rem; opacity:.85; }

    /* 주보 목록 팝업 (주일설교 페이지와 같은 스타일) */
    .sp-overlay{
      position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:1000;
      display:none; align-items:center; justify-content:center; padding:16px;
    }
    .sp-overlay.open{ display:flex; }
    .sp-overlay .sp-modal{
      background:var(--c-bg,#fff); color:var(--c-text,#111); width:100%; max-width:560px;
      max-height:min(640px, 80vh); display:flex; flex-direction:column;
      border-radius:var(--radius-md,12px); box-shadow:0 20px 50px rgba(0,0,0,.25); overflow:hidden;
    }
    .sp-overlay .sp-head{ display:flex; align-items:center; gap:10px; padding:14px 16px 10px; }
    .sp-overlay .sp-head h3{ margin:0; font-size:1rem; font-weight:700; flex:1; }
    .sp-overlay .sp-close{ background:none; border:none; font-size:1.5rem; line-height:1; cursor:pointer; color:inherit; padding:0 4px; }
    .sp-overlay .sp-close:hover{ background:none; }
    .sp-overlay .sp-search{ margin:0 16px 10px; padding:9px 12px; border:1px solid var(--c-border,#ddd); border-radius:8px; font:inherit; font-size:0.9rem; outline:none; background:#fff; color:#111; }
    .sp-overlay .sp-search:focus{ border-color:var(--c-accent); }
    .sp-overlay .sp-list{ overflow-y:auto; padding:0 8px 12px; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }
    .sp-overlay .sp-month{ position:sticky; top:0; z-index:1; background:var(--c-bg,#fff); font-size:0.75rem; font-weight:700; color:var(--c-text-sub,#555); padding:10px 8px 6px; letter-spacing:.02em; }
    .sp-overlay .sp-item{
      display:grid; grid-template-columns:64px 1fr; gap:2px 12px; width:100%; text-align:left;
      background:none; border:none; border-radius:8px; padding:10px 8px; cursor:pointer; font:inherit; color:inherit;
    }
    .sp-overlay .sp-item:hover{ background:var(--c-bg-subtle,#f3f3f3); }
    .sp-overlay .sp-item.is-current{ background:var(--c-accent-light,#ffe1d6); }
    .sp-overlay .sp-date{ grid-row:span 2; font-size:0.82rem; font-weight:700; color:var(--c-accent); padding-top:1px; }
    .sp-overlay .sp-title{ font-size:0.95rem; font-weight:600; line-height:1.35; }
    .sp-overlay .sp-ref{ font-size:0.8rem; color:var(--c-text-sub,#666); }
    .sp-overlay .sp-empty{ text-align:center; padding:24px 0; font-size:0.85rem; color:var(--c-text-sub,#666); }
    @media (max-width:768px){
      .sp-overlay{ align-items:flex-end; padding:0; }
      .sp-overlay .sp-modal{ max-width:none; max-height:85vh; border-radius:16px 16px 0 0; }
    }
    .page-bulletin button{
      padding:10px 12px;
      border:1px solid var(--c-border);
      border-radius:var(--radius-sm);
      background:var(--c-bg);
      font-size:0.9rem;
      cursor:pointer;
    }
    .page-bulletin button:hover{ background:var(--c-bg-subtle); }
    .page-bulletin .meta{ text-align:right; }
    .page-bulletin hr{ margin:18px 0; border:none; border-top:1px solid var(--c-border); }
    .page-bulletin .b-card{
      background:var(--c-bg);
      border-radius:var(--radius-md);
      padding:20px;
      box-shadow:var(--shadow-sm);
      overflow-x:auto;
      transition:transform var(--dur-normal,0.3s) var(--ease-out), box-shadow var(--dur-normal,0.3s) var(--ease-out);
    }
    .page-bulletin .b-card:hover{
      transform:translateY(-3px);
      box-shadow:var(--shadow-md);
    }
    .page-bulletin .b-card h2{ margin:0 0 14px; font-size:1.05rem; font-weight:700; color:var(--c-text); }
    .page-bulletin .b3-grid{
      display:grid;
      grid-template-columns:1fr minmax(320px,1.1fr) 1fr;
      gap:16px;
      align-items:start;
    }
    .page-bulletin .b-mid{
      display:grid;
      grid-template-rows:auto auto;
      gap:16px;
    }
    .page-bulletin .order-table{ width:100%; border-collapse:collapse; font-size:0.9rem; }
    .page-bulletin .order-table th,
    .page-bulletin .order-table td{
      padding:10px 8px;
      border-bottom:1px solid var(--c-border);
      text-align:center;
      vertical-align:middle;
    }
    .page-bulletin .order-table td:last-child,
    .page-bulletin .order-table th:last-child{ white-space:nowrap; }
    .page-bulletin .order-table th{
      color:var(--c-text-sub);
      font-weight:600;
      font-size:0.75rem;
      background:var(--c-bg-subtle);
      border-bottom:1px solid var(--c-border);
    }
    .page-bulletin .order-table tr:last-child td{ border-bottom:none; }
    .page-bulletin .verse{ margin:0; font-size:0.9rem; line-height:1.75; color:var(--c-text); }
    .page-bulletin .news{ list-style:none; margin:0; padding:0; }
    .page-bulletin .news li{
      display:flex;
      gap:10px;
      align-items:flex-start;
      padding:10px 0;
      border-bottom:1px solid var(--c-border);
      font-size:0.9rem;
    }
    .page-bulletin .news li:last-child{ border-bottom:none; }
    .page-bulletin .tag{
      display:inline-block;
      padding:3px 10px;
      border:1px solid var(--c-border);
      border-radius:var(--radius-full);
      font-size:0.75rem;
      color:var(--c-text-sub);
      background:var(--c-bg);
      flex-shrink:0;
    }
    .page-bulletin .txt{ color:var(--c-text-sub); line-height:1.6; }
    .page-bulletin .roster-table{ width:100%; min-width:280px; border-collapse:collapse; font-size:0.9rem; }
    .page-bulletin .roster-table th,
    .page-bulletin .roster-table td{
      border:none;
      border-bottom:1px solid var(--c-border);
      padding:10px 6px;
      text-align:center;
      vertical-align:middle;
      white-space:nowrap;
      min-width:44px;
    }
    .page-bulletin .roster-table th{ font-weight:700; background:var(--c-bg-subtle); }
    .page-bulletin .roster-table thead th{ border-top:1px solid var(--c-border); }
    @media (max-width: 980px){
      .page-bulletin .b3-grid{ grid-template-columns: 1fr; }
      .page-bulletin .meta{ text-align:left; }
      .page-bulletin #weekSelect{ min-width: 180px; }
    }
    @media (max-width: 768px){
      body.page-bulletin .wrap{ padding-top:0; }
      body.page-bulletin main{ margin:0; }
      .page-bulletin .container{ padding:10px 16px 40px; }
      .page-bulletin .topbar{ flex-direction:column; align-items:flex-start; gap:8px; }
      .page-bulletin .controls label{ display:none; }
      .page-bulletin #weekSelect{ width:100%; min-width:0; }
      .page-bulletin .controls{ width:100%; flex-wrap:wrap; gap:6px; }
      .page-bulletin .meta{ width:100%; display:flex; gap:8px; align-items:center; }
    }
  </style>
</head>

<script>
  // 공지사항 동적 로드
  fetch('/data/notice.json',{cache:'no-store'})
    .then(r=>r.json()).then(n=>{
      const el=document.getElementById('siteNotice');
      if(el){ const items=n.items||[]; if(items.length){ el.innerHTML=items.map(item=>{ let line=escapeHtml(item.text||'').replace(/\n/g,'<br>'); if(item.link_url) line+=` <a href="${escapeHtml(item.link_url)}" target="_blank" rel="noreferrer">${escapeHtml(item.link_text||item.link_url)}</a>`; return `<div class="notice-item">${line}</div>`; }).join(''); } }
      const mob=document.getElementById('mobileNotice'); if(!mob) return;
      const items=n.items||[]; if(!items.length) return;
      mob.innerHTML=items.map(item=>`<div class="mobile-notice-item">${escapeHtml(item.text||'').replace(/\n/g,'<br>')}</div>`).join('');
      mob.classList.add('has-items');
    }).catch(()=>{});

  // 모바일 햄버거 메뉴
  (function(){
    const btn=document.getElementById('hamburgerBtn'),overlay=document.getElementById('drawerOverlay'),drawer=document.getElementById('drawer'),closeBtn=document.getElementById('drawerClose');
    if(!btn) return;
    function open(){ drawer.classList.add('open'); overlay.classList.add('open'); document.body.style.overflow='hidden'; }
    function close(){ drawer.classList.remove('open'); overlay.classList.remove('open'); document.body.style.overflow=''; }
    btn.addEventListener('click',open); closeBtn.addEventListener('click',close); overlay.addEventListener('click',close);
  })();

  // 하단 탭바 + 드로어 active 상태
  (function(){
    const path=location.pathname;
    document.querySelectorAll('.bottom-nav-item[data-nav], .drawer a[data-nav], #menu a[data-nav]').forEach(el=>{
      const nav=el.dataset.nav;
      if((nav==='home'&&(path==='/'||path.endsWith('/index.html')&&!path.includes('/bulletin/')&&!path.includes('/sermon/')))||(nav==='bulletin'&&path.includes('/bulletin/'))||(nav==='sermon'&&path.includes('/sermon/')))
        el.classList.add('is-active');
    });
  })();


  const DATA_BASE = "/bulletin/data";
  const qs = new URLSearchParams(location.search);
  const weekParam = qs.get("week");
  const weekSelect = document.getElementById("weekSelect");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  function setWeekInUrl(weekId){
    const u = new URL(location.href);
    u.searchParams.set("week", weekId);
    location.href = u.toString();
  }
  function escapeHtml(s){
    return String(s ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
  }
  function formatWeekLabel(w){
    const date = w.date || w.week_id || "";
    const issue = w.issue ? "("+w.issue+"호)" : "";
    const title = w.title ? " "+w.title : "";
    return (date+" "+issue+title).trim();
  }
  async function fetchJSON(url){
    const res = await fetch(url, { cache:"no-store" });
    if(!res.ok) throw new Error("fetch failed: "+res.status);
    return await res.json();
  }
  async function loadWeeks(){
    // index.json에서 주차 목록 직접 로드 (GitHub API 불필요)
    const indexData = await fetchJSON(DATA_BASE + "/index.json");
    const weeks = (Array.isArray(indexData) ? indexData : [])
      .filter(w => w.week_id)
      .sort((a, b) => b.week_id.localeCompare(a.week_id));

    if (!weeks.length) {
      document.getElementById("weekCur").textContent = "주차 데이터가 없습니다";
      return { weeks: [], selected: "" };
    }

    const selected = (weekParam && weeks.some(w => w.week_id === weekParam))
      ? weekParam : weeks[0].week_id;
    initWeekPicker(weeks, selected);
    return { weeks, selected };
  }

  /* ── 주보 목록 팝업 (날짜 · 설교 제목 · 성경본문) ── */
  const weekInfo = {}; // week_id → { title, ref }
  function rememberWeek(data){
    const w = data.week || {};
    const order = data.worship_order || [];
    const sermon = order.find(r => String(r.step||"").replace(/\s/g,"") === "설교");
    const reading = order.find(r => String(r.step||"").replace(/\s/g,"") === "성경봉독");
    const verse = (data.memory_verse || [])[0] || {};
    weekInfo[w.week_id] = {
      title: (sermon && sermon.content) || w.title || "",
      ref: (reading && reading.content) || verse.reference || ""
    };
  }

  function initWeekPicker(weeks, selected){
    const cur = document.getElementById("weekCur");
    const curWeek = weeks.find(w => w.week_id === selected);
    cur.textContent = formatWeekLabel(curWeek);

    let infoPromise = null;
    function loadAllInfo(){
      if (!infoPromise) {
        infoPromise = Promise.all(weeks.map(async w => {
          if (weekInfo[w.week_id]) return;
          try { rememberWeek(await fetchJSON(DATA_BASE + "/" + encodeURIComponent(w.week_id) + ".json")); }
          catch(_) { weekInfo[w.week_id] = { title: w.title || "", ref: "" }; }
        }));
      }
      return infoPromise;
    }

    const overlay = document.createElement("div");
    overlay.className = "sp-overlay";
    overlay.innerHTML = `
      <div class="sp-modal" role="dialog" aria-modal="true" aria-label="주보 목록">
        <div class="sp-head"><h3>주보 목록</h3><button type="button" class="sp-close" aria-label="닫기">×</button></div>
        <input class="sp-search" type="search" placeholder="설교 제목·본문·날짜로 찾기">
        <div class="sp-list"></div>
      </div>`;
    document.body.appendChild(overlay);
    const list = overlay.querySelector(".sp-list");
    const search = overlay.querySelector(".sp-search");

    function render(){
      const q = search.value.trim().toLowerCase();
      let html = "", lastMonth = "";
      for (const w of weeks) {
        const info = weekInfo[w.week_id] || { title: w.title || "", ref: "" };
        const issue = w.issue ? w.issue + "호" : "";
        if (q && !`${w.week_id} ${w.date||""} ${info.title} ${info.ref} ${issue}`.toLowerCase().includes(q)) continue;
        const d = String(w.week_id).match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
        const month = d ? `${d[1]}년 ${Number(d[2])}월` : "";
        if (month && month !== lastMonth) { html += `<div class="sp-month">${month}</div>`; lastMonth = month; }
        const short = d ? `${Number(d[2])}.${String(Number(d[3])).padStart(2,"0")}` : (w.date || w.week_id);
        const sub = [info.ref, issue].filter(Boolean).join("  ·  ");
        html += `<button type="button" class="sp-item${w.week_id === selected ? " is-current" : ""}" data-week="${escapeHtml(w.week_id)}">
          <span class="sp-date">${escapeHtml(short)}</span>
          <span class="sp-title">${escapeHtml(info.title || formatWeekLabel(w))}</span>
          <span class="sp-ref">${escapeHtml(sub)}</span>
        </button>`;
      }
      list.innerHTML = html || `<div class="sp-empty">찾는 주보가 없습니다.</div>`;
    }

    function open(){
      search.value = "";
      render();
      overlay.classList.add("open");
      document.body.style.overflow = "hidden";
      const c = list.querySelector(".is-current");
      if (c) c.scrollIntoView({ block: "center" });
      loadAllInfo().then(() => { if (overlay.classList.contains("open")) {
        const top = list.scrollTop; render(); list.scrollTop = top;
      } });
    }
    function close(){
      overlay.classList.remove("open");
      document.body.style.overflow = "";
    }

    weekSelect.addEventListener("click", open);
    overlay.addEventListener("click", e => { if (e.target === overlay) close(); });
    overlay.querySelector(".sp-close").addEventListener("click", close);
    document.addEventListener("keydown", e => { if (e.key === "Escape" && overlay.classList.contains("open")) close(); });
    search.addEventListener("input", render);
    list.addEventListener("click", e => {
      const item = e.target.closest(".sp-item");
      if (!item) return;
      close();
      if (item.dataset.week !== selected) setWeekInUrl(item.dataset.week);
    });

    // 현재 주보를 그린 뒤 나머지 주차 정보 미리 불러오기
    window.__loadWeekInfo = loadAllInfo;
  }

  function hookPrevNext(weeks, selected){
    const idx = weeks.findIndex(w => w.week_id === selected);
    prevBtn.onclick = () => { if(idx < 0 || idx >= weeks.length - 1) return; setWeekInUrl(weeks[idx + 1].week_id); };
    nextBtn.onclick = () => { if(idx <= 0) return; setWeekInUrl(weeks[idx - 1].week_id); };
  }
  function renderBulletin(data, monthCommittees){
    const week = data.week || {};
    document.getElementById("issueText").textContent = week.issue ? "주보 "+week.issue+"호" : "주보";
    document.getElementById("dateText").textContent = week.date || week.week_id || "";
    const news = (data.news || []).map(r => r.text).filter(Boolean);
    const order = (data.worship_order || []);
    const memory = (data.memory_verse || [])[0] || null;

    // 예배위원: 월간 전체 주차 표시 (날짜 오름차순)
    const today = new Date().toISOString().slice(0,10);
  const rows = (monthCommittees || []).sort((a,b) => String(a.week_id).localeCompare(String(b.week_id)));
  const upcomingWeekId = rows.filter(r => r.week_id >= today).map(r => r.week_id)[0] || rows[rows.length-1]?.week_id;
    const committeeHtml = rows.length
      ? "<table class='roster-table'><thead><tr><th>날짜</th><th>기도</th><th>찬양</th><th>헌금위원</th></tr></thead><tbody>"
        + rows.map(r => "<tr"+(r.week_id === upcomingWeekId ? " style='background:var(--c-gold-light);font-weight:600;'" : "")+">"
            +"<td>"+escapeHtml(r.week_id||"")+"</td>"
            +"<td>"+escapeHtml(r.pray||"")+"</td>"
            +"<td>"+escapeHtml(r.praise||"")+"</td>"
            +"<td>"+escapeHtml(r.offering||"")+"</td>"
          +"</tr>").join("")
        +"</tbody></table>"
      : "<div class='muted'>예배위원 정보가 없습니다.</div>";

    const orderHtml = order.length
      ? "<table class='order-table'><thead><tr><th style='width:90px;'>순서</th><th>내용</th><th style='width:90px;'>담당</th></tr></thead><tbody>"+order.map(r => "<tr><td>"+escapeHtml(r.step||"")+"</td><td>"+escapeHtml(r.content||"")+"</td><td>"+escapeHtml(r.person||"")+"</td></tr>").join("")+"</tbody></table>"
      : "<div class='muted'>예배순서가 없습니다.</div>";
    const verseHtml = (memory && (memory.reference || memory.text))
      ? "<p class='verse'><b>"+escapeHtml(memory.reference||"")+"</b><br/>"+escapeHtml(memory.text||"")+"</p>"
      : "<div class='muted'>등록된 외울 말씀이 없습니다.</div>";
    const newsHtml = news.length
      ? "<ul class='news'>"+news.map(t => "<li><span class='tag'>소식</span><div class='txt'>"+escapeHtml(t)+"</div></li>").join("")+"</ul>"
      : "<div class='muted'>등록된 소식이 없습니다.</div>";
    document.getElementById("bulletinBody").innerHTML = "<div class='b3-grid'><section class='b-card'><h2>예배순서</h2>"+orderHtml+"</section><section class='b-mid'><section class='b-card'><h2>성경본문</h2>"+verseHtml+"</section><section class='b-card'><h2>예배위원</h2>"+committeeHtml+"</section></section><section class='b-card'><h2>교회소식</h2>"+newsHtml+"</section></div>";
  }
  async function main(){
    const { weeks, selected } = await loadWeeks();
    if(!weeks.length) return;
    hookPrevNext(weeks, selected);

    // 현재 주차 데이터 + committee.json 병렬 로드
    const [data, allCommittee] = await Promise.all([
      fetchJSON(DATA_BASE+"/"+encodeURIComponent(selected)+".json"),
      fetchJSON(DATA_BASE+"/committee.json").catch(()=>[])
    ]);

    // committee.json에서 해당 월(YYYY-MM)의 데이터만 필터링
    const selMonth = selected.slice(0,7);
    const monthRaws = allCommittee.filter(r => r.week_id && r.week_id.slice(0,7) === selMonth);

    // week_id별로 그룹핑 → 한 행으로
    const byWeek = {};
    monthRaws.forEach(r => {
      if(!byWeek[r.week_id]) byWeek[r.week_id] = { week_id: r.week_id, pray:"", praise:"", offering:"" };
      if(r.role === "기도") byWeek[r.week_id].pray = r.name||"";
      if(r.role === "찬양") byWeek[r.week_id].praise = r.name||"";
      if(r.role === "헌금위원") byWeek[r.week_id].offering = r.name||"";
    });
    const monthCommittees = Object.values(byWeek).sort((a,b) => a.week_id.localeCompare(b.week_id));

    renderBulletin(data, monthCommittees);
    rememberWeek(data);
    const info = weekInfo[selected];
    if (info && info.title) {
      const w = weeks.find(x => x.week_id === selected) || {};
      document.getElementById("weekCur").textContent = [w.date || selected, info.title].filter(Boolean).join("  ·  ");
    }
    if (window.__loadWeekInfo) window.__loadWeekInfo();
  }
  main().catch(err => {
    console.error(err);
    document.getElementById("bulletinBody").innerHTML = "<div class='b3-grid'><section class='b-card'><h2>주보 불러오기 실패</h2><div class='muted' style='margin-top:10px;'>오류: "+escapeHtml(err&&err.message||String(err))+"</div></section></div>";
  });
</script>
<script>
  let _installPrompt = null;
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    _installPrompt = e;
    document.getElementById('installBtn').classList.add('visible');
  });
  function installApp() {
    if (_installPrompt) {
      _installPrompt.prompt();
      _installPrompt.userChoice.then(() => { _installPrompt = null; document.getElementById('installBtn').classList.remove('visible'); });
    } else {
      alert('홈화면 추가:\niOS Safari → 공유 버튼 → "홈 화면에 추가"\nAndroid Chrome → 브라우저 메뉴 → "홈 화면에 추가"');
    }
  }
</script>
