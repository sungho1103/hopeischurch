<!doctype html>
<html lang="ko">
<head>

  <meta name="viewport" content="width=device-width,initial-scale=1">

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
      line-height:1.6;
    }

    .wrap {
      display:flex;
      gap:20px;
      max-width:1200px;
      margin:0 auto;
      padding:20px;
      min-height:100vh;
    }

    aside { width:200px; flex-shrink:0; }

    .brand {
      font-size:1.2rem;
      font-weight:700;
      margin-bottom:20px;
    }

    nav {
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    nav a {
      display:block;
      padding:10px 12px;
      text-decoration:none;
    }

    .notice {
      background:#f5f5f5;
      padding:12px;
      border-radius:4px;
      font-size:.9rem;
      margin-top:30px;
      border-left:3px solid #333;
    }

    main { flex:1; min-width:0; }

    h1 { font-size:2rem; margin-bottom:10px; }
    h2 { font-size:1.5rem; margin:30px 0 20px; }

    .sub { margin-bottom:20px; }

    .card {
      border:1px solid #ddd;
      padding:20px;
      margin:20px 0;
      border-radius:4px;
      background:#fafafa;
    }

    section { margin:30px 0; }
    section p { margin:10px 0; }

    hr {
      margin:30px 0;
      border:none;
      border-top:1px solid #ddd;
    }
